に入るキーワードを選べ。","code":"class Item {\n    int price;\n\n    Item(int price) {\n        this.price = price;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Item[] items = new Item[2];\n        items[0] = ____ Item(100);\n        System.out.println(items[0].price);\n    }\n}","choices":["`create`","`this`","`new`","`Item`"],"answer":2,"exp_ja":"オブジェクトの生成には new を使います。","exp_en":"The new keyword is used to create an object.","tag":"オブジェクトの配列"},{"id":"t5-001","theme":5,"type":"tf","q":"static を付けたメソッドは、インスタンスを生成しなくても、クラス名.メソッド名() の形で呼び出せる。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"static メソッド(クラスメソッド)は、クラスに属するため、インスタンスなしで呼び出せます。","exp_en":"A static method (class method) belongs to the class and can be called without an instance.","tag":"static"},{"id":"t5-002","theme":5,"type":"tf","q":"static メソッドの中から、インスタンス変数(static でないメンバ変数)に直接アクセスできる。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"static メソッドはインスタンスなしで呼び出されるため、インスタンス変数には直接アクセスできません。","exp_en":"A static method can be called without an instance, so it cannot access instance variables directly.","tag":"static"},{"id":"t5-003","theme":5,"type":"tf","q":"static変数(クラス変数)は、そのクラスのすべてのインスタンスで共有される。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"static変数はクラスに1つだけ存在し、すべてのインスタンスが同じものを使います。","exp_en":"A static variable exists once per class and is shared by all instances.","tag":"static"},{"id":"t5-004","theme":5,"type":"tf","q":"コンストラクタの名前はクラス名と同じで、戻り値の型は書かない。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"コンストラクタは、クラス名と同じ名前で、戻り値の型(void を含む)を書かずに定義します。","exp_en":"A constructor has the same name as the class and is written without a return type (not even void).","tag":"コンストラクタ"},{"id":"t5-005","theme":5,"type":"tf","q":"クラスにコンストラクタを1つも定義しなかった場合、引数なしのデフォルトコンストラクタが自動的に用意される。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"コンストラクタを書かなければ、コンパイラが引数なしのデフォルトコンストラクタを補います。","exp_en":"If no constructor is written, the compiler supplies a no-argument default constructor.","tag":"コンストラクタ"},{"id":"t5-006","theme":5,"type":"tf","q":"引数ありのコンストラクタだけを定義したクラスでも、new Item() のように引数なしでインスタンスを生成できる。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"コンストラクタを1つでも定義すると、デフォルトコンストラクタは自動で用意されません。引数なしの new はエラーになります。","exp_en":"Once any constructor is defined, no default constructor is supplied, so new Item() causes an error.","tag":"コンストラクタ"},{"id":"t5-007","theme":5,"type":"tf","q":"同じクラスの中に、名前が同じで、引数の型や数が異なるメソッドを複数定義できる。(オーバーロード)","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"引数の並び(シグネチャ)が異なれば、同じ名前のメソッドを定義できます。","exp_en":"Methods with the same name can be defined if their parameter lists differ.","tag":"メソッド"},{"id":"t5-008","theme":5,"type":"tf","q":"戻り値の型が void のメソッドでも、return 10; のように値を返すことができる。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"void のメソッドは値を返せません。return; で処理を終えることはできます。","exp_en":"A void method cannot return a value. It can only end with return;.","tag":"メソッド"},{"id":"t5-009","theme":5,"type":"tf","q":"this は、そのインスタンス自身を表す。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"インスタンスメソッドやコンストラクタの中で this と書くと、そのインスタンス自身を指します。","exp_en":"Inside an instance method or constructor, this refers to the instance itself.","tag":"new演算子と参照型"},{"id":"t5-010","theme":5,"type":"tf","q":"Javaでは、1つのクラスが extends で継承できる親クラスは、1つだけである。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"Javaのクラスは単一継承で、extends に指定できる親クラスは1つです。","exp_en":"Java classes support single inheritance: only one superclass can be given after extends.","tag":"継承"},{"id":"t5-011","theme":5,"type":"mc","q":"クラスの定義として、正しいものはどれか。","code":null,"choices":["`class Item { }`","`Class Item { }`","`class Item() { }`","`new class Item { }`"],"answer":0,"exp_ja":"クラスは、小文字の class の後にクラス名を書き、{ } で囲みます。クラス名の後ろに ( ) は付けません。","exp_en":"Use lowercase class followed by the class name and { }. No parentheses follow the class name.","tag":"クラスの定義"},{"id":"t5-012","theme":5,"type":"mc","q":"メソッドの定義として、正しいものはどれか。","code":null,"choices":["`int add(int a, int b) { return a + b; }`","`add(int a, int b) int { return a + b; }`","`int add(a, b) { return a + b; }`","`def add(int a, int b) { return a + b; }`"],"answer":0,"exp_ja":"メソッドは「戻り値の型 メソッド名(型 引数名, ...) { 処理 }」の形で定義します。引数にも型が必要です。","exp_en":"A method is defined as: return type, name, then typed parameters. Parameters must have types.","tag":"メソッド"},{"id":"t5-013","theme":5,"type":"mc","q":"値を返さないメソッドの戻り値の型として、指定するものはどれか。","code":null,"choices":["`void`","`null`","`int`","`none`"],"answer":0,"exp_ja":"戻り値がないメソッドには void を指定します。","exp_en":"Use void for a method that returns nothing.","tag":"メソッド"},{"id":"t5-014","theme":5,"type":"mc","q":"クラス Item のコンストラクタの定義として、正しいものはどれか。","code":null,"choices":["`Item(int p) { }`","`void Item(int p) { }`","`item(int p) { }`","`constructor Item(int p) { }`"],"answer":0,"exp_ja":"コンストラクタは、クラス名と同じ名前で、戻り値の型を付けずに定義します。void を付けると、ただのメソッドになります。","exp_en":"A constructor uses the class name with no return type. Adding void makes it an ordinary method.","tag":"コンストラクタ"},{"id":"t5-015","theme":5,"type":"mc","q":"クラス Item のインスタンスを生成する文として、正しいものはどれか。","code":null,"choices":["`Item a = new Item();`","`Item a = Item();`","`Item a = new Item;`","`new Item a();`"],"answer":0,"exp_ja":"インスタンスは new クラス名(引数) で生成します。( ) は省略できません。","exp_en":"An instance is created with new ClassName(arguments). The parentheses cannot be omitted.","tag":"new演算子と参照型"},{"id":"t5-016","theme":5,"type":"mc","q":"カプセル化のための設計として、適切なものはどれか。","code":null,"choices":["メンバ変数を private にし、値を読み書きする public なメソッドを用意する","すべてのメンバ変数を public にする","すべてのメンバ変数を static にする","すべてのメソッドの戻り値を void にする"],"answer":0,"exp_ja":"メンバ変数を private で隠し、メソッド(getter / setter など)を通して操作させるのが基本です。","exp_en":"Hide member variables with private and let callers use them through methods such as getters and setters.","tag":"カプセル化とprivate"},{"id":"t5-017","theme":5,"type":"mc","q":"クラス Dog がクラス Animal を継承する宣言として、正しいものはどれか。","code":null,"choices":["`class Dog extends Animal { }`","`class Dog implements Animal { }`","`class Dog : Animal { }`","`class Dog inherits Animal { }`"],"answer":0,"exp_ja":"クラスの継承は extends で表します。implements はインタフェース用です。","exp_en":"Class inheritance uses extends. implements is for interfaces.","tag":"継承"},{"id":"t5-018","theme":5,"type":"mc","q":"継承について、正しい説明はどれか。","code":null,"choices":["子クラスは、親クラスの private でないメンバを引き継ぐ","子クラスは、親クラスの private メンバも直接使える","親クラスは、子クラスのメンバを引き継ぐ","継承すると、親クラスのソースコードが書き換わる"],"answer":0,"exp_ja":"子クラスは親クラスのメンバを引き継ぎますが、private のメンバは直接使えません。親クラスのコードは変わりません。","exp_en":"A subclass inherits non-private members of its superclass. Private members are not directly usable, and the superclass is unchanged.","tag":"継承"},{"id":"t5-019","theme":5,"type":"mc","q":"クラス内に `void show(int a) { }` が定義されている。同じクラスに追加して、オーバーロードとして成立するメソッドはどれか。","code":null,"choices":["`void show(int b) { }`","`void show(String s) { }`","`int show(int a) { return a; }`","`void show(int a) { }`"],"answer":1,"exp_ja":"オーバーロードは、引数の型や数が異なる場合に成立します。引数名や戻り値の型だけが違っても、同じメソッドとみなされ、エラーになります。","exp_en":"Overloading requires different parameter types or counts. Different parameter names or return types alone clash with the existing method.","tag":"メソッド"},{"id":"t5-020","theme":5,"type":"mc","q":"クラス Counter の static変数 count を、クラス名を使って参照する式として、正しいものはどれか。","code":null,"choices":["`Counter.count`","`Counter->count`","`count.Counter`","`Counter::count()`"],"answer":0,"exp_ja":"static変数は クラス名.変数名 で参照できます。","exp_en":"A static variable is referenced as ClassName.variableName.","tag":"static"},{"id":"t5-021","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Counter {\n    static int total = 0;\n    int id;\n\n    Counter() {\n        total++;\n        id = total;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new Counter();\n        new Counter();\n        Counter c = new Counter();\n        System.out.println(c.id + \" \" + Counter.total);\n    }\n}","choices":["`1 3`","`3 3`","`3 1`","`1 1`"],"answer":1,"exp_ja":"total は static変数で全インスタンスが共有するので、3回の生成で 3 になります。id はインスタンス変数で、3番目のオブジェクトには 3 が入ります。","exp_en":"total is a static variable shared by all instances, so it becomes 3 after three creations. id is an instance variable, and the third object gets 3.","tag":"static"},{"id":"t5-022","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Box {\n    int v;\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Box a = new Box();\n        a.v = 1;\n        Box b = a;\n        b.v = 5;\n        System.out.println(a.v);\n    }\n}","choices":["`0`","`1`","`5`","コンパイルエラーになる"],"answer":2,"exp_ja":"Box b = a; では参照(オブジェクトの場所)がコピーされるので、a と b は同じオブジェクトを指します。b 経由の変更は a からも見えます。","exp_en":"Box b = a; copies the reference, so a and b point to the same object. A change through b is visible through a.","tag":"new演算子と参照型"},{"id":"t5-023","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Counter {\n    static int count = 0;\n    int number = 0;\n\n    Counter() {\n        count++;\n        number++;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Counter c1 = new Counter();\n        Counter c2 = new Counter();\n        System.out.println(c1.number + \" \" + c2.number + \" \" + Counter.count);\n    }\n}","choices":["`1 1 2`","`2 2 2`","`1 2 2`","`1 1 1`"],"answer":0,"exp_ja":"number はインスタンス変数なので、それぞれ 1 です。count は static変数で共有され、2回の生成で 2 になります。","exp_en":"number is an instance variable, so each object has 1. count is static and shared, so it is 2 after two creations.","tag":"static"},{"id":"t5-024","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Person {\n    String name;\n\n    Person(String name) {\n        this.name = name;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Person p1 = new Person(\"alice\");\n        Person p2 = p1;\n        p2.name = \"bob\";\n        System.out.println(p1.name);\n    }\n}","choices":["`alice`","`bob`","`null`","コンパイルエラーになる"],"answer":1,"exp_ja":"p2 は p1 と同じオブジェクトを参照しているので、p2.name の変更は p1.name にも反映されます。","exp_en":"p2 refers to the same object as p1, so changing p2.name also changes p1.name.","tag":"new演算子と参照型"},{"id":"t5-025","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Person {\n    String name;\n\n    Person(String name) {\n        this.name = name;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Person p3 = null;\n        System.out.println(p3.name);\n    }\n}","choices":["`null`","`0`","実行時に NullPointerException が発生する","コンパイルエラーになる"],"answer":2,"exp_ja":"p3 は null(何も参照していない)ので、p3.name にアクセスすると NullPointerException が発生します。","exp_en":"p3 is null (refers to nothing), so accessing p3.name throws a NullPointerException.","tag":"new演算子と参照型"},{"id":"t5-026","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"public class Main {\n    static int max(int a, int b) {\n        if (a > b) {\n            return a;\n        }\n        return b;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(max(3, 8) + max(10, 2));\n    }\n}","choices":["`13`","`18`","`10`","`8`"],"answer":1,"exp_ja":"max(3, 8) は 8、max(10, 2) は 10 を返すので、合計は 18 です。","exp_en":"max(3, 8) returns 8 and max(10, 2) returns 10, so the sum is 18.","tag":"メソッド"},{"id":"t5-027","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"public class Main {\n    static void inc(int n) {\n        n++;\n    }\n\n    public static void main(String[] args) {\n        int x = 5;\n        inc(x);\n        System.out.println(x);\n    }\n}","choices":["`5`","`6`","`0`","コンパイルエラーになる"],"answer":0,"exp_ja":"基本データ型の引数は値が渡されます(値渡し)。メソッド内で n を増やしても、呼び出し元の x は変わりません。","exp_en":"Primitive arguments are passed by value. Incrementing n inside the method does not change the caller's x.","tag":"メソッド"},{"id":"t5-028","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Person {\n    String name;\n\n    Person(String name) {\n        this.name = name;\n    }\n}\n\npublic class Main {\n    static void rename(Person p) {\n        p.name = \"bob\";\n    }\n\n    public static void main(String[] args) {\n        Person p = new Person(\"alice\");\n        rename(p);\n        System.out.println(p.name);\n    }\n}","choices":["`alice`","`bob`","`null`","コンパイルエラーになる"],"answer":1,"exp_ja":"オブジェクトの参照が渡されるので、メソッド内で p.name を変更すると、呼び出し元のオブジェクトも変わります。","exp_en":"The object's reference is passed, so changing p.name inside the method changes the caller's object too.","tag":"new演算子と参照型"},{"id":"t5-029","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Person {\n    String name;\n\n    Person(String name) {\n        this.name = name;\n    }\n}\n\npublic class Main {\n    static void reset(Person p) {\n        p = new Person(\"zed\");\n    }\n\n    public static void main(String[] args) {\n        Person p = new Person(\"alice\");\n        reset(p);\n        System.out.println(p.name);\n    }\n}","choices":["`alice`","`zed`","`null`","コンパイルエラーになる"],"answer":0,"exp_ja":"メソッド内の p は参照のコピーです。p に新しいオブジェクトを代入しても、呼び出し元の p は変わらないので alice のままです。","exp_en":"The p inside the method is a copy of the reference. Assigning a new object to it does not change the caller's p.","tag":"new演算子と参照型"},{"id":"t5-030","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Item {\n    String name;\n    int price;\n\n    Item(String name, int price) {\n        this.name = name;\n        this.price = price;\n    }\n\n    Item(String name) {\n        this.name = name;\n        this.price = 0;\n    }\n\n    Item() {\n        this.name = \"none\";\n        this.price = 0;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Item a = new Item(\"pen\");\n        Item b = new Item();\n        System.out.println(a.name + a.price + b.name + b.price);\n    }\n}","choices":["`pen0none0`","`pen100none0`","`pennone`","コンパイルエラーになる"],"answer":0,"exp_ja":"引数の数に応じてコンストラクタが選ばれます(オーバーロード)。new Item(\"pen\") では price が 0、引数なしでは name が none、price が 0 です。","exp_en":"The constructor is chosen by the arguments (overloading). new Item(\"pen\") sets price 0, and the no-argument one sets name none and price 0.","tag":"コンストラクタ"},{"id":"t5-031","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Item {\n    int price;\n\n    Item(int price) {\n        this.price = price;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Item a = new Item();\n        System.out.println(a.price);\n    }\n}","choices":["`0`","`null`","実行時エラーになる","コンパイルエラーになる"],"answer":3,"exp_ja":"引数ありのコンストラクタだけを定義しているので、デフォルトコンストラクタは用意されません。引数なしの new Item() はコンパイルエラーです。","exp_en":"Only a constructor with a parameter is defined, so there is no default constructor. new Item() is a compile error.","tag":"コンストラクタ"},{"id":"t5-032","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Item {\n    int price;\n\n    Item(int price) {\n        price = price;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Item a = new Item(500);\n        System.out.println(a.price);\n    }\n}","choices":["`500`","`0`","`null`","コンパイルエラーになる"],"answer":1,"exp_ja":"this を付けていないので、price = price; は引数 price に自分自身を代入するだけです。フィールドは初期値の 0 のままです。","exp_en":"Without this, price = price; just assigns the parameter to itself. The field stays at its default, 0.","tag":"new演算子と参照型"},{"id":"t5-033","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Util {\n    static int count = 0;\n\n    static void add() {\n        count++;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Util.add();\n        Util.add();\n        System.out.println(Util.count);\n    }\n}","choices":["`0`","`1`","`2`","コンパイルエラーになる"],"answer":2,"exp_ja":"static メソッド add() を、インスタンスなしで2回呼び出しているので、count は 2 になります。","exp_en":"The static method add() is called twice without any instance, so count becomes 2.","tag":"static"},{"id":"t5-034","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Item {\n    int price = 10;\n\n    static int get() {\n        return price;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        System.out.println(Item.get());\n    }\n}","choices":["`10`","`0`","実行時エラーになる","コンパイルエラーになる"],"answer":3,"exp_ja":"static メソッドからインスタンス変数 price には直接アクセスできないため、コンパイルエラーになります。","exp_en":"A static method cannot directly access the instance variable price, so this is a compile error.","tag":"static"},{"id":"t5-035","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Account {\n    int balance;\n\n    void deposit(int n) {\n        balance += n;\n    }\n\n    int getBalance() {\n        return balance;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Account a = new Account();\n        a.deposit(100);\n        a.deposit(50);\n        System.out.println(a.getBalance());\n    }\n}","choices":["`50`","`100`","`150`","`0`"],"answer":2,"exp_ja":"balance は初期値 0 で、deposit のたびに加算されるので、100 + 50 = 150 です。","exp_en":"balance starts at 0 and grows with each deposit, so it is 100 + 50 = 150.","tag":"メソッド"},{"id":"t5-036","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class P {\n    static void show(int n) {\n        System.out.print(\"int\");\n    }\n\n    static void show(String s) {\n        System.out.print(\"str\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        P.show(1);\n        P.show(\"a\");\n    }\n}","choices":["`intstr`","`strint`","`intint`","コンパイルエラーになる"],"answer":0,"exp_ja":"引数の型に合うメソッドが呼び出されます(オーバーロード)。1 は int、\"a\" は String なので、intstr です。","exp_en":"The method matching the argument type is called (overloading). 1 is an int and \"a\" is a String, giving intstr.","tag":"メソッド"},{"id":"t5-037","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class P {\n    static void f(int n) {\n        System.out.print(\"I\");\n    }\n\n    static void f(double d) {\n        System.out.print(\"D\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        P.f(5);\n        P.f(5.0);\n    }\n}","choices":["`II`","`ID`","`DD`","`DI`"],"answer":1,"exp_ja":"5 は int型なので f(int)、5.0 は double型なので f(double) が呼び出されます。","exp_en":"5 is an int, so f(int) is called; 5.0 is a double, so f(double) is called.","tag":"メソッド"},{"id":"t5-038","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Account {\n    private int balance = 100;\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Account a = new Account();\n        System.out.println(a.balance);\n    }\n}","choices":["`100`","`0`","実行時エラーになる","コンパイルエラーになる"],"answer":3,"exp_ja":"private のメンバ変数は、他のクラス(Main)から直接アクセスできないので、コンパイルエラーになります。","exp_en":"A private member variable cannot be accessed directly from another class (Main), so this is a compile error.","tag":"カプセル化とprivate"},{"id":"t5-039","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Account {\n    private int balance;\n\n    void setBalance(int b) {\n        if (b >= 0) {\n            balance = b;\n        }\n    }\n\n    int getBalance() {\n        return balance;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Account a = new Account();\n        a.setBalance(100);\n        a.setBalance(-5);\n        System.out.println(a.getBalance());\n    }\n}","choices":["`-5`","`100`","`0`","コンパイルエラーになる"],"answer":1,"exp_ja":"setBalance は 0 以上の値だけを受け付けます。-5 は無視されるので、balance は 100 のままです。","exp_en":"setBalance accepts only values of 0 or more. -5 is ignored, so balance stays 100.","tag":"カプセル化とprivate"},{"id":"t5-040","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Animal {\n    String name = \"animal\";\n\n    void eat() {\n        System.out.print(\"eat \");\n    }\n}\n\nclass Dog extends Animal {\n    void bark() {\n        System.out.print(\"bark\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Dog d = new Dog();\n        d.eat();\n        d.bark();\n        System.out.println(\" \" + d.name);\n    }\n}","choices":["`bark`","`eat bark animal`","`bark animal`","コンパイルエラーになる"],"answer":1,"exp_ja":"Dog は Animal を継承しているので、eat() と name を使えます。eat、bark の順に出力され、最後に name の animal が続きます。","exp_en":"Dog inherits from Animal, so it can use eat() and name. eat and bark are printed, then the name, animal.","tag":"継承"},{"id":"t5-041","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Animal {\n    private int age = 3;\n}\n\nclass Dog extends Animal {\n    int getAge() {\n        return age;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        System.out.println(new Dog().getAge());\n    }\n}","choices":["`3`","`0`","実行時エラーになる","コンパイルエラーになる"],"answer":3,"exp_ja":"親クラスの private メンバ age は、子クラスからも直接使えないので、コンパイルエラーになります。","exp_en":"The private member age of the superclass cannot be used directly from the subclass, so this is a compile error.","tag":"継承"},{"id":"t5-042","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Animal {\n}\n\nclass Dog extends Animal {\n    void bark() {\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Animal a = new Animal();\n        a.bark();\n        System.out.println(\"done\");\n    }\n}","choices":["`done`","実行時に NullPointerException が発生する","何も表示されない","コンパイルエラーになる"],"answer":3,"exp_ja":"bark() は子クラス Dog のメソッドで、Animal 型の a からは呼び出せません。親は子のメンバを持たないので、コンパイルエラーです。","exp_en":"bark() belongs to the subclass Dog and cannot be called on an Animal. A parent does not have its child's members, so this is a compile error.","tag":"継承"},{"id":"t5-043","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Item {\n    String name;\n    int price;\n    boolean sale;\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Item a = new Item();\n        System.out.println(a.name + \" \" + a.price + \" \" + a.sale);\n    }\n}","choices":["`null 0 false`","`0 0 false`","`null 0 true`","実行時に NullPointerException が発生する"],"answer":0,"exp_ja":"メンバ変数は自動で初期化されます。String は null、int は 0、boolean は false です。","exp_en":"Member variables are initialized automatically: null for String, 0 for int, false for boolean.","tag":"new演算子と参照型"},{"id":"t5-044","theme":5,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class BankAccount {\n    String holder;\n    static int totalAccounts = 0;\n\n    BankAccount(String holder) {\n        this.holder = holder;\n        totalAccounts++;\n    }\n\n    static int getTotalAccounts() {\n        return totalAccounts;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        BankAccount[] accounts = new BankAccount[4];\n        accounts[0] = new BankAccount(\"a\");\n        accounts[1] = new BankAccount(\"b\");\n        System.out.println(BankAccount.getTotalAccounts());\n    }\n}","choices":["`2`","`4`","`0`","`1`"],"answer":0,"exp_ja":"new BankAccount[4] は参照を入れる配列を作るだけで、BankAccount は生成されません。実際に生成したのは2つなので、totalAccounts は 2 です。","exp_en":"new BankAccount[4] only creates the array of references. Just two accounts were actually created, so totalAccounts is 2.","tag":"static"},{"id":"t5-045","theme":5,"type":"fill","q":"インスタンスを生成せずに twice メソッドを呼び出すための、空欄に入る式を選べ。","code":"class MathUtil {\n    static int twice(int n) {\n        return n * 2;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        int r = ____;\n        System.out.println(r);\n    }\n}","choices":["`new twice(4)`","`MathUtil.twice(4)`","`twice.MathUtil(4)`","`MathUtil->twice(4)`"],"answer":1,"exp_ja":"static メソッドは クラス名.メソッド名() で呼び出します。","exp_en":"A static method is called as ClassName.methodName().","tag":"static"},{"id":"t5-046","theme":5,"type":"fill","q":"実行結果が 300 になるように、空欄に入る記述を選べ。","code":"class Item {\n    int price;\n\n    Item(int price) {\n        ____ = price;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Item a = new Item(300);\n        System.out.println(a.price);\n    }\n}","choices":["`price`","`this.price`","`this`","`Item.price`"],"answer":1,"exp_ja":"引数 price と区別して、フィールドを指すには this.price と書きます。","exp_en":"To refer to the field and distinguish it from the parameter price, write this.price.","tag":"new演算子と参照型"},{"id":"t5-047","theme":5,"type":"fill","q":"コンストラクタとして定義するための、空欄に入る名前を選べ。","code":"class Item {\n    int price;\n\n    ____(int price) {\n        this.price = price;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Item a = new Item(40);\n        System.out.println(a.price);\n    }\n}","choices":["`item`","`void Item`","`Item`","`new Item`"],"answer":2,"exp_ja":"コンストラクタは、クラス名と同じ名前(大文字小文字も同じ)で、戻り値の型を付けずに定義します。","exp_en":"A constructor has exactly the same name as the class, including case, and no return type.","tag":"コンストラクタ"},{"id":"t5-048","theme":5,"type":"fill","q":"Dog が Animal を継承するための、空欄に入るキーワードを選べ。","code":"class Animal {\n    void eat() {\n        System.out.println(\"eat\");\n    }\n}\n\nclass Dog ____ Animal {\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new Dog().eat();\n    }\n}","choices":["`implements`","`inherits`","`extends`","`from`"],"answer":2,"exp_ja":"クラスの継承には extends を使います。","exp_en":"Class inheritance uses extends.","tag":"継承"},{"id":"t5-049","theme":5,"type":"fill","q":"値を返さないメソッドになるように、空欄に入る戻り値の型を選べ。","code":"public class Main {\n    static ____ show(int n) {\n        System.out.println(n);\n    }\n\n    public static void main(String[] args) {\n        show(3);\n    }\n}","choices":["`int`","`null`","`void`","`String`"],"answer":2,"exp_ja":"値を返さないメソッドの戻り値の型は void です。int や String では return が必要になります。","exp_en":"The return type of a method that returns nothing is void. int or String would require a return value.","tag":"メソッド"},{"id":"t5-050","theme":5,"type":"fill","q":"外部から値を読み取れるようにするための、空欄に入る修飾子を選べ。","code":"class Account {\n    private int balance = 70;\n\n    ____ int getBalance() {\n        return balance;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        System.out.println(new Account().getBalance());\n    }\n}","choices":["`private`","`public`","`static`","`void`"],"answer":1,"exp_ja":"他のクラスから呼び出すメソッドには public を付けます。private だと外部から呼べず、static だとインスタンス変数を使えません。","exp_en":"A method called from other classes needs public. private blocks outside calls, and static cannot use the instance variable.","tag":"カプセル化とprivate"},{"id":"t6-001","theme":6,"type":"tf","q":"String オブジェクトの内容は、作成した後で変更できない。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"String は変更できない(イミュータブルな)クラスです。concat や replace などは、新しい文字列を返します。","exp_en":"String is immutable. Methods such as concat and replace return a new string.","tag":"String"},{"id":"t6-002","theme":6,"type":"tf","q":"文字列 s の文字数は、s.length と書いて取得する。(括弧は付けない)","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"String の文字数は length() メソッドで取得するので、括弧が必要です。括弧なしの length は配列の要素数の書き方です。","exp_en":"The length of a String is obtained with the length() method, so parentheses are required. Without them is the array form.","tag":"String"},{"id":"t6-003","theme":6,"type":"tf","q":"String a = new String(\"hi\"); と String b = new String(\"hi\"); のとき、a == b は true になる。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"new で別々に生成したので、a と b は別のオブジェクトです。== は参照を比較するため false になります。内容の比較は equals を使います。","exp_en":"They were created separately with new, so they are different objects. == compares references and gives false; use equals for contents.","tag":"String"},{"id":"t6-004","theme":6,"type":"tf","q":"String の charAt(0) は、文字列の最初の文字を返す。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"添字は 0 から始まるので、charAt(0) が先頭の文字です。","exp_en":"Indexes start at 0, so charAt(0) returns the first character.","tag":"String"},{"id":"t6-005","theme":6,"type":"tf","q":"String の indexOf で指定した文字列が見つからない場合、-1 が返される。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"見つからないときは -1 が返ります。見つかったときは、最初に現れる位置の添字です。","exp_en":"When nothing is found, -1 is returned. When found, the index of the first occurrence is returned.","tag":"String"},{"id":"t6-006","theme":6,"type":"tf","q":"StringBuffer の append で文字列を追加すると、元の StringBuffer オブジェクト自体が変更される。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"StringBuffer は変更できる文字列のクラスです。append は、そのオブジェクトの末尾に文字列を追加します。","exp_en":"StringBuffer is mutable. append adds the text to the end of the same object.","tag":"StringBuffer"},{"id":"t6-007","theme":6,"type":"tf","q":"StringBuffer の reverse() は、逆順にした新しいオブジェクトを返すだけで、元の StringBuffer は変更しない。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"reverse() は、元の StringBuffer 自体を逆順に書き換えます(自分自身を返します)。","exp_en":"reverse() rewrites the StringBuffer itself in reverse order (and returns itself).","tag":"StringBuffer"},{"id":"t6-008","theme":6,"type":"tf","q":"Math.round は、小数部分を切り捨てて整数にするメソッドである。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"Math.round は四捨五入です。切り捨てではありません。小数部分を切り捨てるのは Math.floor(正の数の場合)です。","exp_en":"Math.round rounds to the nearest integer; it does not truncate. Math.floor rounds down.","tag":"Math"},{"id":"t6-009","theme":6,"type":"tf","q":"Integer.parseInt(\"abc\") を実行すると、実行時に NumberFormatException が発生する。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"整数として解釈できない文字列を parseInt に渡すと、NumberFormatException が発生します。","exp_en":"Passing a string that cannot be read as an integer to parseInt throws a NumberFormatException.","tag":"Integer・ラッパークラス"},{"id":"t6-010","theme":6,"type":"tf","q":"java.lang パッケージのクラス(String、Math、Integer など)は、import 文を書かなくても使用できる。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"java.lang は自動的にインポートされます。","exp_en":"The java.lang package is imported automatically.","tag":"java.lang・import"},{"id":"t6-011","theme":6,"type":"mc","q":"文字列 s の文字数を取得する式として、正しいものはどれか。","code":null,"choices":["`s.length()`","`s.length`","`s.size()`","`s.count()`"],"answer":0,"exp_ja":"String では length() メソッドを使います。","exp_en":"For a String, use the length() method.","tag":"String"},{"id":"t6-012","theme":6,"type":"mc","q":"Math.random() の戻り値の範囲として、正しいものはどれか。","code":null,"choices":["`0.0` 以上 `1.0` 未満","`0.0` 以上 `1.0` 以下","`1` 以上 `10` 以下","`0` 以上 `100` 未満"],"answer":0,"exp_ja":"Math.random() は、0.0 以上 1.0 未満の double値を返します。1.0 は含まれません。","exp_en":"Math.random() returns a double from 0.0 (inclusive) up to 1.0 (exclusive).","tag":"Math"},{"id":"t6-013","theme":6,"type":"mc","q":"文字列 s に対する s.substring(1, 3) が返す部分の説明として、正しいものはどれか。","code":null,"choices":["添字 1 から 2 までの文字","添字 1 から 3 までの文字","添字 2 から 3 までの文字","添字 0 から 3 までの文字"],"answer":0,"exp_ja":"substring(開始, 終了) は、開始の添字から「終了の1つ手前」までを取り出します。終了の位置は含まれません。","exp_en":"substring(begin, end) returns characters from begin up to, but not including, end.","tag":"String"},{"id":"t6-014","theme":6,"type":"mc","q":"Math.pow(2, 3) の戻り値のデータ型として、正しいものはどれか。","code":null,"choices":["`int`","`double`","`long`","`float`"],"answer":1,"exp_ja":"Math.pow は double型の値(この例では 8.0)を返します。","exp_en":"Math.pow returns a double (here 8.0).","tag":"Math"},{"id":"t6-015","theme":6,"type":"mc","q":"StringBuffer の末尾に文字列を追加するメソッドはどれか。","code":null,"choices":["`append`","`add`","`push`","`concat`"],"answer":0,"exp_ja":"StringBuffer では append を使います。","exp_en":"StringBuffer uses the append method.","tag":"StringBuffer"},{"id":"t6-016","theme":6,"type":"mc","q":"文字列 s を int型の整数に変換するための式として、正しいものはどれか。","code":null,"choices":["`Integer.parseInt(s)`","`Integer.toString(s)`","`String.toInt(s)`","`Math.parseInt(s)`"],"answer":0,"exp_ja":"文字列を int に変換するには Integer.parseInt を使います。","exp_en":"Use Integer.parseInt to convert a string to an int.","tag":"Integer・ラッパークラス"},{"id":"t6-017","theme":6,"type":"mc","q":"基本データ型 char に対応するラッパークラスはどれか。","code":null,"choices":["`Char`","`Character`","`String`","`Chr`"],"answer":1,"exp_ja":"char のラッパークラスは Character です。int は Integer、boolean は Boolean です。","exp_en":"The wrapper class of char is Character. int pairs with Integer and boolean with Boolean.","tag":"Integer・ラッパークラス"},{"id":"t6-018","theme":6,"type":"mc","q":"キーボード(標準入力)から1行ずつ文字列を読み込むために使うクラスの組合せとして、正しいものはどれか。","code":null,"choices":["`BufferedReader` と `InputStreamReader`","`FileWriter` と `PrintWriter`","`Reader` と `Writer`","`Math` と `String`"],"answer":0,"exp_ja":"new BufferedReader(new InputStreamReader(System.in)) で、標準入力から1行ずつ読み込めます。","exp_en":"new BufferedReader(new InputStreamReader(System.in)) reads from standard input line by line.","tag":"java.io"},{"id":"t6-019","theme":6,"type":"mc","q":"BufferedReader の readLine() メソッドの戻り値の型はどれか。","code":null,"choices":["`String`","`int`","`char`","`byte`"],"answer":0,"exp_ja":"readLine() は、読み込んだ1行を String で返します(入力の終わりでは null)。","exp_en":"readLine() returns the line as a String (null at the end of input).","tag":"java.io"},{"id":"t6-020","theme":6,"type":"mc","q":"小数点以下を切り上げるメソッドはどれか。","code":null,"choices":["`Math.ceil()`","`Math.floor()`","`Math.round()`","`Math.abs()`"],"answer":0,"exp_ja":"Math.ceil は切り上げ、Math.floor は切り捨て、Math.round は四捨五入です。","exp_en":"Math.ceil rounds up, Math.floor rounds down, and Math.round rounds to the nearest integer.","tag":"Math"},{"id":"t6-021","theme":6,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    public static void main(String[] args) {\n        String s = \"Java\";\n        s.concat(\"8\");\n        System.out.println(s);\n    }\n}","choices":["`Java8`","`Java`","`8`","コンパイルエラーになる"],"answer":1,"exp_ja":"String は変更できないオブジェクトです。concat は連結した新しい文字列を返すだけで、s 自体は変わりません。","exp_en":"String is immutable. concat returns a new string and does not change s.","tag":"String"},{"id":"t6-022","theme":6,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    public static void main(String[] args) {\n        StringBuffer sb = new StringBuffer(\"abc\");\n        sb.append(\"de\").reverse();\n        System.out.println(sb);\n    }\n}","choices":["`abcde`","`edcba`","`cbade`","`edabc`"],"answer":1,"exp_ja":"append で \"abcde\" になり、reverse で逆順の \"edcba\" になります。StringBuffer は元のオブジェクト自体を変更します。","exp_en":"append makes \"abcde\", and reverse turns it into \"edcba\". StringBuffer modifies the object itself.","tag":"StringBuffer"},{"id":"t6-023","theme":6,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    public static void main(String[] args) {\n        System.out.println(Math.round(2.5) + \" \" + Math.max(3, 7));\n    }\n}","choices":["`2 7`","`3 7`","`2 3`","`3 3`"],"answer":1,"exp_ja":"Math.round は四捨五入するので 2.5 は 3 になります。Math.max は大きい方の 7 を返します。","exp_en":"Math.round rounds 2.5 up to 3, and Math.max returns the larger value, 7.","tag":"Math"},{"id":"t6-024","theme":6,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    public static void main(String[] args) {\n        String s = \"abcdef\";\n        System.out.println(s.substring(2) + s.charAt(1));\n    }\n}","choices":["`cdefb`","`bcdef`","`cdefc`","`bcdefa`"],"answer":0,"exp_ja":"substring(2) は添字 2 以降の \"cdef\"、charAt(1) は \"b\" なので、連結して cdefb です。","exp_en":"substring(2) is \"cdef\" and charAt(1) is \"b\", so the result is cdefb.","tag":"String"},{"id":"t6-025","theme":6,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    public static void main(String[] args) {\n        String s = \"banana\";\n        System.out.println(s.indexOf(\"na\") + \" \" + s.indexOf(\"x\"));\n    }\n}","choices":["`2 -1`","`3 -1`","`2 0`","`1 -1`"],"answer":0,"exp_ja":"\"na\" が最初に現れるのは添字 2 です。\"x\" は含まれないので -1 です。","exp_en":"\"na\" first appears at index 2. \"x\" is not found, so -1.","tag":"String"},{"id":"t6-026","theme":6,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    public static void main(String[] args) {\n        String a = new String(\"hi\");\n        String b = new String(\"hi\");\n        System.out.println((a == b) + \" \" + a.equals(b));\n    }\n}","choices":["`true true`","`false true`","`false false`","`true false`"],"answer":1,"exp_ja":"== は参照が同じか(同じオブジェクトか)を比較するので false、equals は内容を比較するので true です。","exp_en":"== checks whether they are the same object (false), while equals compares contents (true).","tag":"String"},{"id":"t6-027","theme":6,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    public static void main(String[] args) {\n        String s = \"  Ab \";\n        System.out.println(s.trim().toUpperCase() + s.length());\n    }\n}","choices":["`AB5`","`AB4`","`ab5`","`Ab2`"],"answer":0,"exp_ja":"trim() は前後の空白を除き、toUpperCase() で AB になります。s 自体は変わらず、元の長さ(空白を含む5文字)は 5 です。","exp_en":"trim() removes surrounding spaces and toUpperCase() gives AB. s itself is unchanged, and its length with the spaces is 5.","tag":"String"},{"id":"t6-028","theme":6,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    public static void main(String[] args) {\n        String s = \"java.io\";\n        System.out.println(s.replace('.', '-') + \" \" + s.startsWith(\"java\"));\n    }\n}","choices":["`java-io true`","`java.io true`","`java-io false`","`javaio true`"],"answer":0,"exp_ja":"replace で . が - に置き換わり、startsWith(\"java\") は true です。","exp_en":"replace changes . to -, and startsWith(\"java\") is true.","tag":"String"},{"id":"t6-029","theme":6,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    public static void main(String[] args) {\n        System.out.println(\"Java\".equalsIgnoreCase(\"JAVA\"));\n    }\n}","choices":["`true`","`false`","`Java`","コンパイルエラーになる"],"answer":0,"exp_ja":"equalsIgnoreCase は大文字・小文字を区別せずに内容を比較するので、true です。","exp_en":"equalsIgnoreCase compares contents ignoring case, so the result is true.","tag":"String"},{"id":"t6-030","theme":6,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    public static void main(String[] args) {\n        String s = \"\";\n        for (int i = 0; i < 3; i++) {\n            s += i;\n        }\n        System.out.println(s + s.length());\n    }\n}","choices":["`0123`","`0124`","`012`","`3`"],"answer":0,"exp_ja":"s は \"012\" になり、s.length() は 3 です。文字列と数値の連結なので、012 の後ろに 3 が続きます。","exp_en":"s becomes \"012\" and s.length() is 3. This is string concatenation, so 3 follows 012.","tag":"String"},{"id":"t6-031","theme":6,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    public static void main(String[] args) {\n        StringBuffer sb = new StringBuffer(\"ac\");\n        sb.insert(1, \"b\");\n        System.out.println(sb);\n    }\n}","choices":["`abc`","`bac`","`acb`","`abbc`"],"answer":0,"exp_ja":"insert(1, \"b\") は、添字 1 の位置に b を挿入するので、abc になります。","exp_en":"insert(1, \"b\") inserts b at index 1, giving abc.","tag":"StringBuffer"},{"id":"t6-032","theme":6,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    public static void main(String[] args) {\n        StringBuffer sb = new StringBuffer(\"abcdef\");\n        sb.delete(1, 3);\n        System.out.println(sb);\n    }\n}","choices":["`adef`","`aef`","`abef`","`def`"],"answer":0,"exp_ja":"delete(1, 3) は、添字 1 から 2 まで(3 は含まない)の bc を削除するので、adef です。","exp_en":"delete(1, 3) removes bc at indexes 1 to 2 (3 excluded), leaving adef.","tag":"StringBuffer"},{"id":"t6-033","theme":6,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    static void add(StringBuffer sb) {\n        sb.append(\"x\");\n    }\n\n    static void add(String s) {\n        s = s + \"x\";\n    }\n\n    public static void main(String[] args) {\n        StringBuffer sb = new StringBuffer(\"a\");\n        String s = \"a\";\n        add(sb);\n        add(s);\n        System.out.println(sb + \" \" + s);\n    }\n}","choices":["`ax ax`","`ax a`","`a ax`","`a a`"],"answer":1,"exp_ja":"StringBuffer は参照が渡されるため、メソッド内の append で呼び出し元の sb が変わります。String は変更できず、s = s + \"x\" は新しい文字列を作るだけで、呼び出し元の s は変わりません。","exp_en":"The StringBuffer reference is passed, so append changes the caller's sb. A String cannot change; s = s + \"x\" creates a new string and the caller's s stays the same.","tag":"StringBuffer"},{"id":"t6-034","theme":6,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    public static void main(String[] args) {\n        StringBuffer sb = new StringBuffer(\"hello\");\n        System.out.println(sb.length() + \" \" + sb.charAt(1));\n    }\n}","choices":["`5 h`","`5 e`","`4 e`","`6 e`"],"answer":1,"exp_ja":"length() は文字数の 5、charAt(1) は 2文字目の e です。","exp_en":"length() is 5 and charAt(1) is the second character, e.","tag":"StringBuffer"},{"id":"t6-035","theme":6,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    public static void main(String[] args) {\n        System.out.println(Math.abs(-5) + Math.pow(2, 3));\n    }\n}","choices":["`13`","`13.0`","`58.0`","`7.0`"],"answer":1,"exp_ja":"Math.abs(-5) は 5、Math.pow(2, 3) は double の 8.0 です。足し算の結果は 13.0 になります。","exp_en":"Math.abs(-5) is 5 and Math.pow(2, 3) is the double 8.0, so the sum is 13.0.","tag":"Math"},{"id":"t6-036","theme":6,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    public static void main(String[] args) {\n        System.out.println(Math.round(-2.5) + \" \" + Math.round(2.4));\n    }\n}","choices":["`-3 2`","`-2 2`","`-2 3`","`-3 3`"],"answer":1,"exp_ja":"Math.round は「0.5 を足して切り捨てる」計算です。-2.5 は -2、2.4 は 2 になります。","exp_en":"Math.round adds 0.5 and rounds down. -2.5 becomes -2 and 2.4 becomes 2.","tag":"Math"},{"id":"t6-037","theme":6,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    public static void main(String[] args) {\n        System.out.println(Math.floor(3.7) + \" \" + Math.ceil(3.2));\n    }\n}","choices":["`3 4`","`3.0 4.0`","`4.0 4.0`","`3.0 3.0`"],"answer":1,"exp_ja":"floor は切り捨て、ceil は切り上げです。どちらも double型の値を返すので 3.0 と 4.0 になります。","exp_en":"floor rounds down and ceil rounds up. Both return doubles, so the results are 3.0 and 4.0.","tag":"Math"},{"id":"t6-038","theme":6,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    public static void main(String[] args) {\n        System.out.println(Math.sqrt(16) + Math.min(3, 2));\n    }\n}","choices":["`6`","`6.0`","`4.02`","`18.0`"],"answer":1,"exp_ja":"Math.sqrt(16) は 4.0、Math.min(3, 2) は 2 で、足し算なので 6.0 です。文字列連結ではありません。","exp_en":"Math.sqrt(16) is 4.0 and Math.min(3, 2) is 2. This is addition, not concatenation, so the result is 6.0.","tag":"Math"},{"id":"t6-039","theme":6,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    public static void main(String[] args) {\n        int n = Integer.parseInt(\"12\");\n        System.out.println(n + 1);\n    }\n}","choices":["`13`","`121`","`12`","コンパイルエラーになる"],"answer":0,"exp_ja":"parseInt で整数 12 に変換されているので、n + 1 は 13 です。","exp_en":"parseInt converts it to the integer 12, so n + 1 is 13.","tag":"Integer・ラッパークラス"},{"id":"t6-040","theme":6,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    public static void main(String[] args) {\n        int n = Integer.parseInt(\"12a\");\n        System.out.println(n);\n    }\n}","choices":["`12`","`0`","実行時に NumberFormatException が発生する","コンパイルエラーになる"],"answer":2,"exp_ja":"\"12a\" は整数として解釈できないため、実行時に NumberFormatException が発生します。","exp_en":"\"12a\" cannot be read as an integer, so a NumberFormatException is thrown at runtime.","tag":"Integer・ラッパークラス"},{"id":"t6-041","theme":6,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    public static void main(String[] args) {\n        Integer a = 10;\n        int b = a + 5;\n        System.out.println(b);\n    }\n}","choices":["`15`","`105`","`10`","コンパイルエラーになる"],"answer":0,"exp_ja":"Integer と int の間は、自動的に変換されます(ボクシング・アンボクシング)。10 + 5 = 15 です。","exp_en":"Integer and int are converted automatically (boxing and unboxing). 10 + 5 = 15.","tag":"Integer・ラッパークラス"},{"id":"t6-042","theme":6,"type":"output","q":"次のプログラムを実行し、キーボードから hello と入力して Enter キーを押したときの出力はどれか。","code":"import java.io.*;\n\npublic class Main {\n    public static void main(String[] args) throws IOException {\n        BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n        String line = br.readLine();\n        System.out.println(line.length());\n    }\n}","choices":["`5`","`6`","`hello`","コンパイルエラーになる"],"answer":0,"exp_ja":"readLine() は入力した1行(改行を除く)を返すので、\"hello\" の length() は 5 です。","exp_en":"readLine() returns the entered line without the line break, so the length of \"hello\" is 5.","tag":"java.io"},{"id":"t6-043","theme":6,"type":"output","q":"次のプログラムを実行し、キーボードから 3 と入力して Enter キー、続けて 4 と入力して Enter キーを押したときの出力はどれか。","code":"import java.io.*;\n\npublic class Main {\n    public static void main(String[] args) throws IOException {\n        BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n        int a = Integer.parseInt(br.readLine());\n        int b = Integer.parseInt(br.readLine());\n        System.out.println(a + b);\n    }\n}","choices":["`7`","`34`","`3`","コンパイルエラーになる"],"answer":0,"exp_ja":"readLine() で読んだ文字列を parseInt で整数に変換しているので、3 + 4 = 7 です。変換しなければ文字列連結になります。","exp_en":"The strings from readLine() are converted with parseInt, so 3 + 4 = 7. Without conversion it would be concatenation.","tag":"java.io"},{"id":"t6-044","theme":6,"type":"output","q":"次のプログラムをコンパイルしたときの結果はどれか。","code":"import java.io.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n        String line = br.readLine();\n        System.out.println(line);\n    }\n}","choices":["コンパイルに成功し、入力した文字列が表示される","コンパイルに成功し、実行時に IOException が発生する","警告が出るが、コンパイルは成功する","コンパイルエラーになる"],"answer":3,"exp_ja":"readLine() は IOException を発生させる可能性があるメソッドです。main に throws IOException を付けるか、try-catch で処理しないと、コンパイルエラーになります。","exp_en":"readLine() may throw an IOException. Without throws IOException on main (or try-catch), it is a compile error.","tag":"java.io"},{"id":"t6-045","theme":6,"type":"fill","q":"実行結果が bc になるように、空欄に入るメソッド名を選べ。","code":"public class Main {\n    public static void main(String[] args) {\n        String s = \"abcdef\";\n        System.out.println(s.____(1, 3));\n    }\n}","choices":["`substring`","`charAt`","`indexOf`","`replace`"],"answer":0,"exp_ja":"substring(1, 3) は添字 1 から 2 までを取り出し、bc になります。","exp_en":"substring(1, 3) takes indexes 1 to 2, giving bc.","tag":"String"},{"id":"t6-046","theme":6,"type":"fill","q":"実行結果が cba になるように、空欄に入るメソッド名を選べ。","code":"public class Main {\n    public static void main(String[] args) {\n        StringBuffer sb = new StringBuffer(\"abc\");\n        sb.____();\n        System.out.println(sb);\n    }\n}","choices":["`reversed`","`reverse`","`invert`","`flip`"],"answer":1,"exp_ja":"StringBuffer の reverse() が、文字列を逆順に書き換えます。","exp_en":"StringBuffer's reverse() rewrites the contents in reverse order.","tag":"StringBuffer"},{"id":"t6-047","theme":6,"type":"fill","q":"実行結果が 1024.0 になるように、空欄に入るメソッド名を選べ。","code":"public class Main {\n    public static void main(String[] args) {\n        System.out.println(Math.____(2, 10));\n    }\n}","choices":["`power`","`max`","`pow`","`exp`"],"answer":2,"exp_ja":"べき乗(2 の 10 乗)は Math.pow(2, 10) で、double の 1024.0 になります。","exp_en":"Math.pow(2, 10) computes 2 to the power of 10 and returns the double 1024.0.","tag":"Math"},{"id":"t6-048","theme":6,"type":"fill","q":"実行結果が 50 になるように、空欄に入るメソッド名を選べ。","code":"public class Main {\n    public static void main(String[] args) {\n        int n = Integer.____(\"25\");\n        System.out.println(n * 2);\n    }\n}","choices":["`toString`","`parseString`","`valueOfInt`","`parseInt`"],"answer":3,"exp_ja":"文字列 \"25\" を整数に変換する parseInt を使うと、25 * 2 = 50 です。","exp_en":"parseInt converts the string \"25\" to an integer, so 25 * 2 = 50.","tag":"Integer・ラッパークラス"},{"id":"t6-049","theme":6,"type":"fill","q":"BufferedReader を使うために必要な import 文の、空欄に入るパッケージを選べ。","code":"import ____;\n\npublic class Main {\n    public static void main(String[] args) {\n        BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n        System.out.println(\"ok\");\n    }\n}","choices":["`java.util.*`","`java.lang.*`","`java.io.*`","`java.net.*`"],"answer":2,"exp_ja":"BufferedReader と InputStreamReader は java.io パッケージのクラスです。","exp_en":"BufferedReader and InputStreamReader belong to the java.io package.","tag":"java.io"},{"id":"t6-050","theme":6,"type":"fill","q":"readLine() の戻り値を受け取る変数の型として、空欄に入るものを選べ。(入力: hello)","code":"import java.io.*;\n\npublic class Main {\n    public static void main(String[] args) throws IOException {\n        BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n        ____ line = br.readLine();\n        System.out.println(line);\n    }\n}","choices":["`String`","`int`","`char`","`byte`"],"answer":0,"exp_ja":"readLine() は String を返すので、String型の変数で受け取ります。","exp_en":"readLine() returns a String, so it is received in a String variable.","tag":"java.io"}];
const TN=["","Javaの基礎","データ・演算子","制御文","配列","クラスとメソッド","クラスライブラリ"];
const TY={tf:"正誤",mc:"4択",output:"実行結果",fill:"空欄補充"};
const LB=["ア","イ","ウ","エ"],K="j3drill1",H="j3hist1",N=7,GOAL=63*60;
const $=s=>document.querySelector(s),B={};D.forEach(q=>B[q.id]=q);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const fm=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\n/g,"<br>");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const mmss=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
let S=ld(K,null),V="home",T0=Date.now(),tick=null,RS=false;
if(S&&!S.ids.every(i=>B[i]))S=null;
const el=()=>Math.round((S.acc+Date.now()-T0)/1000);
const save=()=>{S.acc=el()*1000;T0=Date.now();sv(K,S)};
const ok=id=>S.ans[id]===B[id].answer;

function start(){
  const ids=[];for(let t=1;t<=6;t++)ids.push(...sh(D.filter(q=>q.theme===t)).slice(0,N).map(q=>q.id));
  const perm={};ids.forEach(id=>{const n=B[id].choices.length;perm[id]=B[id].type==="tf"?[0,1]:sh([...Array(n).keys()])});
  S={ids,perm,ans:{},i:0,acc:0,done:false};T0=Date.now();sv(K,S);V="quiz";render();
}
function body(id,live){
  const q=B[id],p=S.perm[id],a=S.ans[id],done=a!==undefined;
  let h=`<p class="q">${fm(q.q)}</p>`;
  if(q.code)h+=`<pre><code>${esc(q.code)}</code></pre>`;
  p.forEach((o,k)=>{
    const c=done?(o===q.answer?" ok":o===a?" ng":""):"";
    h+=`<button class="ch${c}" ${done?"disabled":""} data-a="pick" data-v="${k}"><span class="mk">${LB[k]}</span><span>${fm(q.choices[o])}</span></button>`;
  });
  if(done){
    h+=`<p class="vd ${ok(id)?"ok":"ng"}">${ok(id)?"正解":"不正解　正解は "+LB[p.indexOf(q.answer)]}</p>`;
    h+=`<details><summary>解説 / Explanation</summary><div class="ex"><p><b>日本語</b>${fm(q.exp_ja)}</p><p lang="en"><b>EN</b>${fm(q.exp_en)}</p></div></details>`;
  }
  return h;
}
function home(){
  const hist=ld(H,[]);
  let h=`<h1>Java 3級ドリル</h1><p class="mut">42問(6分野×7問)を、問題バンクからランダムに出題します。1問ごとに答え合わせと解説(日本語・英語)を確認できます。</p>`;
  if(S&&!S.done)h+=`<p>前回の続き:${S.i+1}問目まで進んでいます。</p><button class="btn" data-a="resume">続きから</button><button class="btn sub" data-a="new">新しく始める</button>`;
  else h+=`<button class="btn" data-a="new">42問スタート</button>`+(S&&S.done?`<button class="btn sub" data-a="result">前回の結果を見る</button>`:"");
  h+=`<p class="mut">目安時間は${GOAL/60}分(1問約1.5分)。進み具合は、この端末のブラウザに保存されます。</p>`;
  if(hist.length)h+=`<h2>これまでの結果</h2><table><tr><th>日付</th><th>得点</th><th>時間</th></tr>${hist.map(r=>`<tr><td>${esc(r.d)}</td><td>${r.s} / ${r.n}(${Math.round(r.s/r.n*100)}%)</td><td>${mmss(r.t)}</td></tr>`).join("")}</table>`;
  h+=`<div class="zone"><h2 style="margin-top:0">データのリセット</h2><p class="mut">このドリルがブラウザに保存した「途中経過・前回の結果・これまでの結果」をすべて消します。他のサイトのデータや、ブラウザ全体の履歴には影響しません。</p>`+
    (RS?`<p class="vd ng">本当にリセットしますか?元に戻せません。</p><button class="btn dng" data-a="resetgo">リセットする</button><button class="btn sub" data-a="resetno">やめる</button>`
       :`<button class="btn sub dng" data-a="resetask">ブラウザの保存データをリセット</button>`)+`</div>`;
  return h;
}
function quiz(){
  const id=S.ids[S.i],q=B[id],last=S.i===S.ids.length-1,done=S.ans[id]!==undefined;
  return `<header class="top"><div class="row"><span><b>${S.i+1}</b> / ${S.ids.length}</span><span id="tm" class="mut"></span><a href="#" class="mut" data-a="home">ホームへ</a></div><div class="bar"><i style="width:${S.i/S.ids.length*100}%"></i></div></header>
  <p class="meta">大問${q.theme} ${TN[q.theme]}／${TY[q.type]}／${esc(q.tag)}</p>${body(id)}
  ${done?`<button class="btn" data-a="next">${last?"結果を見る":"次の問題"}</button>`:""}`;
}
function result(){
  const n=S.ids.length,s=S.ids.filter(ok).length,pct=Math.round(s/n*100),need=Math.ceil(n*.6);
  const th={},tg={};
  S.ids.forEach(id=>{const q=B[id],r=ok(id)?1:0;(th[q.theme]=th[q.theme]||[0,0]);th[q.theme][0]+=r;th[q.theme][1]++;(tg[q.tag]=tg[q.tag]||[0,0]);tg[q.tag][0]+=r;tg[q.tag][1]++});
  const weak=Object.entries(tg).filter(e=>e[1][0]<e[1][1]).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]||b[1][1]-a[1][1]).slice(0,6);
  const wrong=S.ids.filter(id=>!ok(id));
  return `<h1>結果</h1><p class="big">${s} / ${n}<span class="mut" style="font-size:1rem">　${pct}%　所要 ${mmss(S.acc/1000)}</span></p>
  <p class="mut">本番の合格基準は得点率60%です。この回では${need}問以上が目安です。${s>=need?"到達しています。":"あと"+(need-s)+"問です。"}</p>
  <h2>分野別</h2><div class="g">${Object.keys(th).map(t=>`<span>${TN[t]}</span><div class="bar"><i style="width:${th[t][0]/th[t][1]*100}%"></i></div><span>${th[t][0]}/${th[t][1]}</span>`).join("")}</div>
  <h2>見直したい項目</h2>${weak.length?`<table>${weak.map(e=>`<tr><td>${esc(e[0])}</td><td>${e[1][0]} / ${e[1][1]}</td></tr>`).join("")}</table>`:`<p class="mut">全問正解です。</p>`}
  <h2>間違えた問題(${wrong.length})</h2>${wrong.map(id=>`<details><summary>大問${B[id].theme} ${esc(B[id].tag)}:${esc(B[id].q.replace(/[`\n]/g," ").slice(0,34))}…</summary>${body(id)}</details>`).join("")||`<p class="mut">ありません。</p>`}
  <h2>結果のダウンロード</h2><p class="mut">問題・選択肢・あなたの解答・正解・解説(日本語/英語)を全${n}問ぶん保存します。</p>
  <p><button class="btn sub" data-a="dltxt">テキスト(.txt)</button><button class="btn sub" data-a="dlcsv">CSV(.csv・Excel用)</button></p>
  <p><button class="btn" data-a="new">新しい42問に挑戦</button><button class="btn sub" data-a="home">ホームへ</button></p>`;
}
function render(){
  $("#app").innerHTML=V==="quiz"?quiz():V==="result"?result():home();
  clearInterval(tick);
  if(V==="quiz"){const f=()=>{const e=$("#tm");if(e)e.textContent="経過 "+mmss(el())+" / 目安 "+mmss(GOAL)};f();tick=setInterval(f,1000)}
  window.scrollTo(0,0);
}
const stamp=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return ""+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes())};
const plain=s=>String(s==null?"":s).replace(/`/g,"");
function rows(){
  return S.ids.map((id,i)=>{
    const q=B[id],p=S.perm[id],a=S.ans[id],ch=p.map(o=>plain(q.choices[o]));
    const mine=a===undefined?-1:p.indexOf(a),right=p.indexOf(q.answer);
    return {no:i+1,theme:q.theme,tn:TN[q.theme],ty:TY[q.type],tag:q.tag,q:plain(q.q),code:q.code||"",ch,
      mine:mine<0?"未回答":LB[mine],mineT:mine<0?"":ch[mine],right:LB[right],rightT:ch[right],
      res:a===undefined?"未回答":(a===q.answer?"正解":"不正解"),ja:plain(q.exp_ja),en:plain(q.exp_en)};
  });
}
function buildTxt(){
  const R=rows(),n=R.length,s=R.filter(r=>r.res==="正解").length;
  let t=["Java 3級ドリル 結果","日時: "+new Date().toLocaleString("ja-JP"),"得点: "+s+" / "+n+"("+Math.round(s/n*100)+"%)","所要時間: "+mmss(S.acc/1000),"",
    "【分野別】"];
  for(let k=1;k<=6;k++){const r=R.filter(x=>x.theme===k);if(r.length)t.push(TN[k]+": "+r.filter(x=>x.res==="正解").length+" / "+r.length)}
  t.push("");
  R.forEach(r=>{
    t.push("=".repeat(40),"問"+r.no+"  大問"+r.theme+" "+r.tn+" / "+r.ty+" / "+r.tag,"","[問題]",r.q);
    if(r.code)t.push("","[コード]",r.code);
    t.push("","[選択肢]");r.ch.forEach((c,k)=>t.push(LB[k]+". "+c));
    t.push("","あなたの解答: "+r.mine+(r.mineT?"  "+r.mineT:""),"正解: "+r.right+"  "+r.rightT,"判定: "+r.res,"","[解説]",r.ja,"[Explanation]",r.en,"");
  });
  return t.join("\n");
}
function buildCsv(){
  const R=rows(),c=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const head=["番号","大問","分野","形式","項目","問題","コード","ア","イ","ウ","エ","あなたの解答","正解","判定","解説(日本語)","Explanation(EN)"];
  const L=[head.map(c).join(",")];
  R.forEach(r=>L.push([r.no,r.theme,r.tn,r.ty,r.tag,r.q,r.code,r.ch[0]||"",r.ch[1]||"",r.ch[2]||"",r.ch[3]||"",
    r.mine+(r.mineT?" "+r.mineT:""),r.right+" "+r.rightT,r.res,r.ja,r.en].map(c).join(",")));
  return "\ufeff"+L.join("\r\n");
}
function dl(name,text,mime){
  const u=URL.createObjectURL(new Blob([text],{type:mime})),a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function wipe(){
  [K,H].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
  S=null;RS=false;V="home";render();
}
const act={
  new:start,
  resume(){V="quiz";T0=Date.now();render()},
  home(e){e&&e.preventDefault&&e.preventDefault();if(S&&!S.done)save();RS=false;V="home";render()},
  resetask(){RS=true;render()},
  resetno(){RS=false;render()},
  resetgo:wipe,
  dltxt(){dl("Java3級ドリル_結果_"+stamp()+".txt",buildTxt(),"text/plain;charset=utf-8")},
  dlcsv(){dl("Java3級ドリル_結果_"+stamp()+".csv",buildCsv(),"text/csv;charset=utf-8")},
  result(){V="result";render()},
  pick(k){const id=S.ids[S.i];if(S.ans[id]!==undefined)return;S.ans[id]=S.perm[id][+k];save();render()},
  next(){
