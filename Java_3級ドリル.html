<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Java 3級ドリル</title>
<style>
:root{--bg:#eef1f4;--fg:#14202b;--mut:#5b6b7a;--card:#fff;--line:#d3dae1;--acc:#0b6e99;--ok:#1a7f4b;--okb:#e3f4ea;--ng:#c0392b;--ngb:#fbe9e6;--code:#f2f4f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151a;--fg:#e6ebf0;--mut:#93a1ae;--card:#18202a;--line:#2c3743;--acc:#4fb3dd;--ok:#55c486;--okb:#12301f;--ng:#ff8a78;--ngb:#3a1a16;--code:#0d1217}}
:root[data-theme="dark"]{--bg:#10151a;--fg:#e6ebf0;--mut:#93a1ae;--card:#18202a;--line:#2c3743;--acc:#4fb3dd;--ok:#55c486;--okb:#12301f;--ng:#ff8a78;--ngb:#3a1a16;--code:#0d1217}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 "Hiragino Sans","Yu Gothic UI","Noto Sans JP",Meiryo,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:720px;margin:0 auto;padding:0 16px 48px}
h1{font-size:1.5rem;margin:28px 0 4px}h2{font-size:1.1rem;margin:28px 0 8px}
p{margin:8px 0}.mut{color:var(--mut);font-size:.88rem}
code,pre{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.9em}
pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font-size:.88rem;line-height:1.55;margin:12px 0}
pre code{background:none;padding:0;font-size:inherit}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc)}
.meta{margin:16px 0 4px;font-size:.82rem;color:var(--mut)}
.q{font-size:1.05rem;margin:4px 0}
.ch{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.ch:hover:not(:disabled){border-color:var(--acc)}.ch:focus-visible,.btn:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ch:disabled{cursor:default}
.mk{flex:none;width:28px;height:28px;border:2px solid var(--mut);border-radius:50%;display:grid;place-items:center;font-size:.85rem;line-height:1;margin-top:1px}
.ch.ok{background:var(--okb);border-color:var(--ok)}.ch.ok .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.ng{background:var(--ngb);border-color:var(--ng)}.ch.ng .mk{background:var(--ng);border-color:var(--ng);color:#fff}
.vd{margin:14px 0 6px;font-weight:700}.vd.ok{color:var(--ok)}.vd.ng{color:var(--ng)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0}
summary{cursor:pointer;font-weight:600}
.ex p{margin:8px 0}.ex b{display:inline-block;min-width:2.2em;color:var(--acc);font-size:.8rem}
.btn{font:inherit;font-weight:700;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 20px;cursor:pointer;margin:6px 8px 6px 0}
.btn.sub{background:none;color:var(--acc);border:1px solid var(--acc)}
.btn.dng{background:var(--ng)}.btn.sub.dng{background:none;color:var(--ng);border:1px solid var(--ng)}
.zone{margin-top:32px;padding-top:12px;border-top:1px solid var(--line)}
.big{font-size:2.4rem;font-weight:800;line-height:1.2}
.g{display:grid;grid-template-columns:8.5em 1fr 4em;gap:6px 10px;align-items:center;font-size:.9rem}.g span:last-child{text-align:right}
table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
</style>
</head>
<body>
<main id="app"></main>
<script>
const D=[{"id":"t1-001","theme":1,"type":"tf","q":"Javaのソースコードをコンパイルすると、OSに依存しない中間コード(バイトコード)が生成される。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"コンパイルで生成される .class ファイルにはバイトコードが入っており、JVMが各OS上で実行します。","exp_en":"Compiling produces a .class file containing bytecode, which the JVM runs on each OS.","tag":"バイトコードとJVM"},{"id":"t1-002","theme":1,"type":"tf","q":"main メソッドを持たないクラスは、コンパイルエラーになる。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"コンパイルは成功します。ただし、そのクラスを単独で実行しようとすると、main メソッドがないので実行時にエラーになります。","exp_en":"It compiles fine. Running that class directly fails at runtime because there is no main method.","tag":"作成ルールと実行手順"},{"id":"t1-003","theme":1,"type":"tf","q":"javac コマンドは、コンパイル済みのクラスファイルを実行するために使用する。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"javac はソースコードをコンパイルするコマンドです。実行は java コマンドで行います。","exp_en":"javac compiles source code. Running a program is done with the java command.","tag":"作成ルールと実行手順"},{"id":"t1-004","theme":1,"type":"tf","q":"Hello クラスをコンパイルした後に実行するときは、java Hello.class と入力する。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"実行時はクラス名だけを指定し、java Hello と入力します。拡張子 .class は付けません。","exp_en":"To run it, give only the class name: java Hello. Do not add the .class extension.","tag":"作成ルールと実行手順"},{"id":"t1-005","theme":1,"type":"tf","q":"Javaでは英大文字と小文字が区別されるため、Value と value は別の名前として扱われる。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"Javaは大文字・小文字を区別します。Value と value は別の識別子です。","exp_en":"Java is case-sensitive, so Value and value are different identifiers.","tag":"作成ルールと実行手順"},{"id":"t1-006","theme":1,"type":"tf","q":"ガベージコレクションにより、不要になったオブジェクトのメモリは自動的に解放される。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"JVMが使われなくなったオブジェクトを検出し、メモリを自動的に回収します。","exp_en":"The JVM detects objects that are no longer used and reclaims their memory automatically.","tag":"Javaの特徴"},{"id":"t1-007","theme":1,"type":"tf","q":"1つのクラスから、複数のインスタンスを生成できる。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"new を使うたびに、同じクラスから別々のインスタンスが作られます。それぞれのインスタンスは独立した値を持ちます。","exp_en":"Each use of new creates a separate instance of the same class, and each instance holds its own values.","tag":"インスタンス"},{"id":"t1-008","theme":1,"type":"tf","q":"Javaでは、ポインタ演算によってメモリのアドレスを直接操作できる。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"Javaにはポインタ演算がありません。メモリの直接操作ができない点が安全性につながっています。","exp_en":"Java has no pointer arithmetic. Not being able to touch memory directly contributes to its safety.","tag":"Javaの特徴"},{"id":"t1-009","theme":1,"type":"tf","q":"識別子(変数名など)の先頭に数字を使うことができる。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"識別子の先頭には数字を使えません。英字、_(アンダースコア)、$ から始めます。","exp_en":"An identifier cannot start with a digit. It starts with a letter, an underscore, or a dollar sign.","tag":"作成ルールと実行手順"},{"id":"t1-010","theme":1,"type":"tf","q":"メソッドとは、オブジェクトが行う処理(動作)をまとめたものである。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"メソッドは、クラスに定義する処理のまとまりです。オブジェクトはメソッドを通して動作します。","exp_en":"A method is a named block of processing defined in a class. Objects act through their methods.","tag":"メソッド"},{"id":"t1-011","theme":1,"type":"tf","q":"extends で継承する側のクラスを子クラス(サブクラス)、継承される側のクラスを親クラス(スーパークラス)という。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"class Dog extends Animal では、Dog が子クラス(サブクラス)、Animal が親クラス(スーパークラス)です。","exp_en":"In class Dog extends Animal, Dog is the subclass (child) and Animal is the superclass (parent).","tag":"継承"},{"id":"t1-012","theme":1,"type":"tf","q":"インスタンスごとに異なる値を保持するための変数を、メンバ変数(インスタンス変数)という。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"クラスの中に宣言する変数がメンバ変数で、インスタンスごとに別々の値を持てます(static でない場合)。","exp_en":"A variable declared inside a class is a member variable, and each instance can hold its own value (when it is not static).","tag":"メンバ変数"},{"id":"t1-013","theme":1,"type":"mc","q":"継承を使う利点として、最も適切なものはどれか。","code":null,"choices":["共通するメンバ変数やメソッドを親クラスにまとめ、コードの重複を減らせる","プログラムの実行速度が必ず速くなる","メンバ変数を外部から隠せる","複数のクラスを1つのファイルにまとめられる"],"answer":0,"exp_ja":"共通部分を親クラスにまとめて、子クラスが引き継ぐことで、同じコードを何度も書かずに済みます。外部から隠すのはカプセル化の役割です。","exp_en":"Putting shared parts in a superclass that subclasses inherit avoids repeating code. Hiding data from outside is encapsulation's role.","tag":"継承"},{"id":"t1-014","theme":1,"type":"tf","q":"オブジェクトのメソッドを呼び出して処理を依頼することを、オブジェクトにメッセージを送るという。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"オブジェクト指向では、メソッドの呼び出しを「メッセージの送信」と考えます。","exp_en":"In object-oriented terms, calling a method is regarded as sending a message to the object.","tag":"メッセージ"},{"id":"t1-015","theme":1,"type":"tf","q":"JRE(Java Runtime Environment)には、ソースコードをコンパイルするための javac コマンドが含まれる。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"javac は開発用ツールで、JDK(Java Development Kit)に含まれます。JRE は実行環境です。","exp_en":"javac is a development tool included in the JDK. The JRE is only the runtime environment.","tag":"バイトコードとJVM"},{"id":"t1-016","theme":1,"type":"tf","q":"private を付けたメンバ変数には、他のクラスから直接アクセスできる。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"private のメンバは、そのクラスの内部からだけアクセスできます。他のクラスからは直接アクセスできません。","exp_en":"A private member is accessible only from inside its own class, not directly from other classes.","tag":"カプセル化とprivate"},{"id":"t1-017","theme":1,"type":"tf","q":"new キーワードを使うと、クラスからインスタンスを生成できる。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"new でクラスの設計図から実体(インスタンス)を生成します。","exp_en":"The new keyword creates an instance from a class.","tag":"インスタンス"},{"id":"t1-018","theme":1,"type":"tf","q":"Javaは、オブジェクト指向ではなく、手続き型専用の言語である。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"Javaはオブジェクト指向言語です。クラスとオブジェクトを中心にプログラムを組み立てます。","exp_en":"Java is an object-oriented language built around classes and objects.","tag":"Javaの特徴"},{"id":"t1-019","theme":1,"type":"tf","q":"Javaは、マルチスレッドプログラミングをサポートしている。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"複数の処理を並行して実行するマルチスレッドを、言語として標準でサポートしています。","exp_en":"Java supports multithreading as a standard language feature.","tag":"Javaの特徴"},{"id":"t1-020","theme":1,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"class Animal {\n    int legs = 4;\n}\n\nclass Dog extends Animal {\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        System.out.println(new Dog().legs);\n    }\n}","choices":["`4`","`0`","実行時エラーになる","コンパイルエラーになる"],"answer":0,"exp_ja":"Dog は Animal を継承しているので、Animal のメンバ変数 legs を引き継ぎます。new Dog().legs は 4 です。","exp_en":"Dog inherits the member variable legs from Animal, so new Dog().legs is 4.","tag":"継承"},{"id":"t1-021","theme":1,"type":"tf","q":"カプセル化とは、データとその処理を1つのクラスにまとめ、外部に見せたくない情報を隠すことである。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"カプセル化では、メンバ変数を private にして隠し、メソッド経由で操作させるのが基本です。","exp_en":"In encapsulation, member variables are usually made private and accessed only through methods.","tag":"カプセル化とprivate"},{"id":"t1-022","theme":1,"type":"tf","q":"継承を使うと、既存のクラスのメンバ変数やメソッドを引き継いだ新しいクラスを定義できる。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"子クラスは、親クラスのメンバ変数やメソッドを引き継ぎます。共通部分を再利用できるのが継承の利点です。","exp_en":"A subclass inherits the member variables and methods of its superclass, so common parts can be reused.","tag":"継承"},{"id":"t1-023","theme":1,"type":"tf","q":"1つのソースファイルには複数のクラスを定義できるが、public クラスは1つまでである。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"public でないクラスは複数書けます。public クラスはファイル名と同じ名前の1つだけです。","exp_en":"Non-public classes can be many; only one public class is allowed, named after the file.","tag":"作成ルールと実行手順"},{"id":"t1-024","theme":1,"type":"tf","q":"javac コマンドでコンパイルすると、拡張子が .class のファイルが生成される。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"コンパイルするとバイトコードを格納した .class ファイルが作られます。","exp_en":"Compiling produces .class files that contain the bytecode.","tag":"バイトコードとJVM"},{"id":"t1-025","theme":1,"type":"tf","q":"ソースコードを修正した後は、再コンパイルしなくても、修正内容が実行結果に反映される。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"java コマンドが実行するのは .class ファイルです。修正後は再度コンパイルする必要があります。","exp_en":"java runs the .class file, so the source must be recompiled after a change.","tag":"作成ルールと実行手順"},{"id":"t1-026","theme":1,"type":"tf","q":"メソッドを呼び出すときに渡す値を引数といい、メソッドが呼び出し元へ返す値を戻り値という。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"メソッドは、引数を受け取って処理し、必要に応じて戻り値を返します。","exp_en":"A method receives arguments, processes them, and returns a value to the caller if needed.","tag":"メソッド"},{"id":"t1-027","theme":1,"type":"mc","q":"次のメソッドの説明として、正しいものはどれか。\n\n`int add(int a, int b) { return a + b; }`","code":null,"choices":["戻り値の型は int で、引数は2つである","戻り値の型は void で、引数は2つである","戻り値の型は int で、引数はない","戻り値はなく、引数は int型が1つである"],"answer":0,"exp_ja":"メソッド名の前の int が戻り値の型、( ) の中の int a, int b が2つの引数です。","exp_en":"The int before the method name is the return type, and int a, int b in the parentheses are two parameters.","tag":"メソッド"},{"id":"t1-028","theme":1,"type":"mc","q":"クラスを継承して新しいクラスを定義するときに使うキーワードはどれか。","code":null,"choices":["`implements`","`extends`","`inherits`","`super`"],"answer":1,"exp_ja":"継承は class Dog extends Animal のように extends で表します。","exp_en":"Inheritance is written with extends, as in class Dog extends Animal.","tag":"継承"},{"id":"t1-029","theme":1,"type":"tf","q":"java.lang パッケージのクラス(String など)は、import 文を書かなくても使用できる。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"java.lang は自動的にインポートされます。","exp_en":"The java.lang package is imported automatically.","tag":"クラスライブラリ"},{"id":"t1-030","theme":1,"type":"mc","q":"カプセル化のために、メンバ変数に付ける修飾子として最も適切なものはどれか。","code":null,"choices":["`public`","`private`","`static`","`void`"],"answer":1,"exp_ja":"private を付けると外部から直接アクセスできなくなり、情報を隠せます。","exp_en":"private prevents direct outside access and hides the information.","tag":"カプセル化とprivate"},{"id":"t1-031","theme":1,"type":"mc","q":"次のクラスを定義したソースファイルの名前として、正しいものはどれか。","code":"public class Hello {\n    public static void main(String[] args) {\n        System.out.println(\"Hello\");\n    }\n}","choices":["hello.java","Hello.java","Hello.class","Main.java"],"answer":1,"exp_ja":"public クラスのソースファイル名は、クラス名と大文字小文字まで一致させる必要があります。","exp_en":"A source file with a public class must have exactly the same name as the class, including case.","tag":"作成ルールと実行手順"},{"id":"t1-032","theme":1,"type":"mc","q":"Hello.java をコンパイルするコマンドとして、正しいものはどれか。","code":null,"choices":["`compile Hello.java`","`javac Hello`","`javac Hello.class`","`javac Hello.java`"],"answer":3,"exp_ja":"コンパイルは javac にソースファイル名(拡張子 .java 付き)を指定します。","exp_en":"Compile with javac followed by the source file name, including the .java extension.","tag":"作成ルールと実行手順"},{"id":"t1-033","theme":1,"type":"tf","q":"メソッドの中で宣言した変数(ローカル変数)は、そのメソッドの外からは使用できない。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"ローカル変数は宣言したメソッド(ブロック)の中でだけ有効です。クラスの直下に宣言するメンバ変数とは違います。","exp_en":"A local variable is valid only inside the method (block) where it is declared, unlike a member variable declared directly in the class.","tag":"メンバ変数"},{"id":"t1-034","theme":1,"type":"mc","q":"識別子(変数名)として使用できるものはどれか。","code":null,"choices":["`2value`","`my-var`","`_count`","`new`"],"answer":2,"exp_ja":"_count は有効です。2value は先頭が数字、my-var は - を含む、new は予約語なので使えません。","exp_en":"_count is valid. 2value starts with a digit, my-var contains a hyphen, and new is a reserved word.","tag":"作成ルールと実行手順"},{"id":"t1-035","theme":1,"type":"mc","q":"Javaの予約語(キーワード)ではないものはどれか。","code":null,"choices":["`if`","`class`","`value`","`while`"],"answer":2,"exp_ja":"if、class、while は予約語です。value は予約語ではありません。","exp_en":"if, class, and while are reserved words. value is not.","tag":"作成ルールと実行手順"},{"id":"t1-036","theme":1,"type":"mc","q":"メンバ変数とローカル変数の説明として、正しいものはどれか。","code":null,"choices":["メンバ変数はクラスの直下に、ローカル変数はメソッドの中に宣言する","メンバ変数はメソッドの中に、ローカル変数はクラスの直下に宣言する","どちらもクラスの直下に宣言する","どちらもメソッドの中に宣言する"],"answer":0,"exp_ja":"クラスの直下に宣言する変数がメンバ変数、メソッドの中で宣言する変数がローカル変数です。","exp_en":"A variable declared directly in the class is a member variable; one declared inside a method is a local variable.","tag":"メンバ変数"},{"id":"t1-037","theme":1,"type":"mc","q":"プログラムの実行開始点となる main メソッドの宣言として、正しいものはどれか。","code":null,"choices":["`public static void main(String[] args)`","`public void main(String[] args)`","`static public int main(String[] args)`","`public static main(String[] args)`"],"answer":0,"exp_ja":"main は public static で戻り値は void、引数は String 配列です。","exp_en":"main must be public static, return void, and take a String array.","tag":"作成ルールと実行手順"},{"id":"t1-038","theme":1,"type":"mc","q":"Java仮想マシン(JVM)の役割として、正しいものはどれか。","code":null,"choices":["ソースコードを編集する","バイトコードを各OS上で解釈して実行する","ソースコードをバイトコードに変換する","画面のデザインを作成する"],"answer":1,"exp_ja":"JVMはバイトコードを実行します。ソースからバイトコードへの変換はコンパイラ(javac)の役割です。","exp_en":"The JVM executes bytecode. Converting source to bytecode is the compiler's (javac) job.","tag":"バイトコードとJVM"},{"id":"t1-039","theme":1,"type":"mc","q":"オブジェクト指向の用語の説明として、正しいものはどれか。","code":null,"choices":["クラスから生成された実体を、インスタンスという","メソッドは、変数を宣言するための記述である","メンバ変数は、メソッドの処理内容そのものを表す","継承とは、複数のクラスを1つのファイルにまとめることである"],"answer":0,"exp_ja":"クラスは設計図で、new で生成した実体がインスタンスです。他の選択肢は、用語の意味が異なります。","exp_en":"A class is a blueprint, and the entity created with new is an instance. The other options misdescribe the terms.","tag":"インスタンス"},{"id":"t1-040","theme":1,"type":"mc","q":"Javaの特徴として、誤っているものはどれか。","code":null,"choices":["バイトコードにより、OSに依存せず実行できる","ガベージコレクションが、不要なメモリを自動で解放する","実行するOSごとに、ソースコードを書き直す必要がある","オブジェクト指向言語である"],"answer":2,"exp_ja":"バイトコードにより、同じプログラムをOSごとに書き直さずに実行できます。","exp_en":"Thanks to bytecode, the same program runs on each OS without being rewritten.","tag":"Javaの特徴"},{"id":"t1-041","theme":1,"type":"output","q":"次のコードをコンパイルしたときの結果はどれか。","code":"public class Main {\n    public static void main(String[] args) {\n        int a = 5\n        System.out.println(a);\n    }\n}","choices":["コンパイルエラーになる","実行時エラーになる","5 が表示される","何も表示されず正常に終了する"],"answer":0,"exp_ja":"int a = 5 の末尾にセミコロンがないため、コンパイルエラーになります。","exp_en":"The semicolon after int a = 5 is missing, so a compile error occurs.","tag":"作成ルールと実行手順"},{"id":"t1-042","theme":1,"type":"output","q":"次のコードを Main.java という名前で保存してコンパイルしたときの結果はどれか。","code":"public class Sample {\n    public static void main(String[] args) {\n        System.out.println(\"Hello\");\n    }\n}","choices":["コンパイルエラーになる","コンパイルに成功し、Main.class が生成される","コンパイルに成功し、実行すると Hello と表示される","警告だけが出て、Sample.class が生成される"],"answer":0,"exp_ja":"public クラス名(Sample)とファイル名(Main.java)が一致しないため、コンパイルエラーになります。","exp_en":"The public class name (Sample) does not match the file name (Main.java), so compilation fails.","tag":"作成ルールと実行手順"},{"id":"t1-043","theme":1,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"System.out.print(\"A\");\nSystem.out.println(\"B\");\nSystem.out.print(\"C\");","choices":["ABC が1行で表示される","1行目に AB、2行目に C が表示される","1行目に A、2行目に BC が表示される","A、B、C が1行ずつ表示される"],"answer":1,"exp_ja":"A は改行なし、B は println で改行あり、C は改行なしです。よって AB の後に改行し、C が続きます。","exp_en":"A has no line break, B uses println (line break), and C has none. So AB, then a new line, then C.","tag":"作成ルールと実行手順"},{"id":"t1-044","theme":1,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"System.out.println(\"X\\nY\");","choices":["X\\nY と1行で表示される","XY と1行で表示される","X と Y が別々の行に表示される","コンパイルエラーになる"],"answer":2,"exp_ja":"\\n は改行を表すので、X の後で改行して Y が表示されます。","exp_en":"\\n is a line break, so Y is printed on the line after X.","tag":"作成ルールと実行手順"},{"id":"t1-045","theme":1,"type":"mc","q":"カプセル化の利点として、最も適切なものはどれか。","code":null,"choices":["外部から不正な値を直接代入されることを防ぎ、データを守れる","プログラムの実行速度が必ず速くなる","クラスの数を減らせる","継承が不要になる"],"answer":0,"exp_ja":"メンバ変数を private で隠し、メソッド経由でのみ操作させることで、不正な値の代入を防げます。","exp_en":"Hiding member variables with private and allowing access only through methods prevents invalid values from being assigned.","tag":"カプセル化とprivate"},{"id":"t1-046","theme":1,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"System.out.println(\"A\");\n/* System.out.println(\"B\");\n   System.out.println(\"C\"); */\nSystem.out.println(\"D\");","choices":["A、B、C、D が1行ずつ表示される","A と D が別々の行に表示される","A だけが表示される","コンパイルエラーになる"],"answer":1,"exp_ja":"/* と */ で囲まれた B と C の出力文はコメントなので実行されず、A と D だけが表示されます。","exp_en":"The statements for B and C are inside a block comment and are not executed, so only A and D are printed.","tag":"作成ルールと実行手順"},{"id":"t1-047","theme":1,"type":"tf","q":"private を付けたメソッドは、同じクラスの別のメソッドからは呼び出せる。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"private は「そのクラスの内部からだけ使える」という意味なので、同じクラスの中なら呼び出せます。","exp_en":"private means usable only from inside the class, so other methods of the same class can call it.","tag":"カプセル化とprivate"},{"id":"t1-048","theme":1,"type":"fill","q":"空欄に入るキーワードとして、正しいものはどれか。","code":"public ____ void main(String[] args) {\n    System.out.println(\"Start\");\n}","choices":["`static`","`final`","`abstract`","`private`"],"answer":0,"exp_ja":"main メソッドは、インスタンスを生成せずに呼び出せるよう static で宣言します。","exp_en":"main is declared static so it can be called without creating an instance.","tag":"作成ルールと実行手順"},{"id":"t1-049","theme":1,"type":"mc","q":"クラスとインスタンスの関係の説明として、正しいものはどれか。","code":null,"choices":["クラスは設計図で、インスタンスはその設計図から作られた実体である","クラスは実体で、インスタンスは設計図である","クラスとインスタンスは、同じものを指す言葉である","クラスはメソッドのことで、インスタンスは変数のことである"],"answer":0,"exp_ja":"クラスは設計図に当たり、new で生成した実体がインスタンス(オブジェクト)です。","exp_en":"A class is a blueprint, and an entity created from it with new is an instance (object).","tag":"インスタンス"},{"id":"t1-050","theme":1,"type":"fill","q":"クラスを定義するための空欄に入るキーワードはどれか。","code":"____ Item {\n    int price;\n}","choices":["`Class`","`class`","`object`","`new`"],"answer":1,"exp_ja":"クラス定義には小文字の class を使います。Class と書くとエラーです。","exp_en":"Use lowercase class to define a class. Class with a capital C is an error.","tag":"作成ルールと実行手順"},{"id":"t2-001","theme":2,"type":"tf","q":"条件演算子 (? :) は、条件式が true のとき : の左側の値になり、false のとき右側の値になる。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"a ? b : c は、a が true なら b、false なら c を返します。","exp_en":"a ? b : c returns b when a is true and c when a is false.","tag":"条件演算子"},{"id":"t2-002","theme":2,"type":"tf","q":"char型の値は、'A' のようにシングルクォート(')で囲んで表す。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"1文字を表す char リテラルはシングルクォートで囲みます。文字列(String)はダブルクォートです。","exp_en":"A char literal is enclosed in single quotes. A String literal uses double quotes.","tag":"基本データ型"},{"id":"t2-003","theme":2,"type":"tf","q":"char c = \"A\"; と書くと、char型の変数 c に文字 A を代入できる。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"\"A\" は String型です。char型に代入するには 'A' と書きます。","exp_en":"\"A\" is a String. To assign to a char, write 'A'.","tag":"基本データ型"},{"id":"t2-004","theme":2,"type":"tf","q":"boolean型の変数には、整数の 0 や 1 を代入できる。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"boolean型に代入できるのは true と false だけです。整数は代入できません。","exp_en":"A boolean can only hold true or false. Integers cannot be assigned to it.","tag":"基本データ型"},{"id":"t2-005","theme":2,"type":"tf","q":"long型の変数に 3000000000 を代入するには、3000000000L のように末尾に L を付ける必要がある。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"整数リテラルはint型として扱われ、3000000000 は int の範囲を超えるためエラーになります。L を付けて long リテラルにします。","exp_en":"Integer literals are int by default, and 3000000000 exceeds the int range. Add L to make it a long literal.","tag":"基本データ型"},{"id":"t2-006","theme":2,"type":"tf","q":"float f = 1.5; は、コンパイルエラーになる。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"1.5 は double型のリテラルです。float に代入するには 1.5f と書く必要があります。","exp_en":"1.5 is a double literal. To assign it to a float, write 1.5f.","tag":"基本データ型"},{"id":"t2-007","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int a = 5;\nint b = 8;\nSystem.out.println((a < b) + \" \" + (a >= b));","choices":["`true false`","`true true`","`false false`","`false true`"],"answer":0,"exp_ja":"5 < 8 は true、5 >= 8 は false です。boolean と文字列の連結では、true や false がそのまま表示されます。","exp_en":"5 < 8 is true and 5 >= 8 is false. In concatenation with a String, boolean values are shown as true or false.","tag":"関係演算子"},{"id":"t2-008","theme":2,"type":"tf","q":"論理演算子 && では、左辺が false のとき、右辺は評価されない。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"&& は短絡評価を行います。左辺が false なら全体が false に決まるため、右辺は評価されません。","exp_en":"&& uses short-circuit evaluation. If the left side is false, the right side is not evaluated.","tag":"論理演算子"},{"id":"t2-009","theme":2,"type":"tf","q":"enum は、あらかじめ決められた値の集まり(列挙)を表す型を定義するために使う。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"enum Color { RED, GREEN, BLUE } のように、取りうる値を列挙して型を定義します。","exp_en":"enum defines a type from a fixed list of values, such as enum Color { RED, GREEN, BLUE }.","tag":"enum"},{"id":"t2-010","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int n = 66;\nchar c = (char) n;\nSystem.out.println(c);","choices":["`B`","`66`","`b`","コンパイルエラーになる"],"answer":0,"exp_ja":"int の 66 を (char) にキャストすると、文字コード 66 の文字である大文字の B になります。","exp_en":"Casting the int 66 to char gives the character with code 66, the uppercase B.","tag":"型変換(キャスト)"},{"id":"t2-011","theme":2,"type":"mc","q":"byte型の変数に格納できる値の範囲はどれか。","code":null,"choices":["`0` 〜 `255`","`-128` 〜 `127`","`-256` 〜 `255`","`-32768` 〜 `32767`"],"answer":1,"exp_ja":"byte型は8ビットの符号付き整数で、-128〜127 です。-32768〜32767 は short型です。","exp_en":"byte is an 8-bit signed integer: -128 to 127. The range -32768 to 32767 belongs to short.","tag":"基本データ型"},{"id":"t2-012","theme":2,"type":"mc","q":"基本データ型(プリミティブ型)ではないものはどれか。","code":null,"choices":["`int`","`boolean`","`String`","`double`"],"answer":2,"exp_ja":"String はクラス(参照型)です。int、boolean、double は基本データ型です。","exp_en":"String is a class (reference type). int, boolean, and double are primitive types.","tag":"基本データ型"},{"id":"t2-013","theme":2,"type":"mc","q":"次の代入文のうち、コンパイルエラーになるものはどれか。","code":null,"choices":["`byte b = 10;`","`long l = 100;`","`int i = 3.5;`","`double d = 5;`"],"answer":2,"exp_ja":"double型の値 3.5 を、キャストなしで int型に代入することはできません(情報が失われるため)。","exp_en":"A double value like 3.5 cannot be assigned to an int without a cast, because information would be lost.","tag":"型変換(キャスト)"},{"id":"t2-014","theme":2,"type":"tf","q":"文字列(String型)の変数 a と b は、a < b のように関係演算子で大小を比較できる。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"関係演算子 < > <= >= は数値(char を含む)に使います。String の大小比較には使えず、コンパイルエラーになります。","exp_en":"The relational operators < > <= >= work on numbers (including char). They cannot compare Strings and cause a compile error.","tag":"関係演算子"},{"id":"t2-015","theme":2,"type":"fill","q":"実行結果が true になるように、空欄に入る演算子を選べ。","code":"int a = 7;\nSystem.out.println(a ____ 7);","choices":["`<=`","`<`","`>`","`!=`"],"answer":0,"exp_ja":"a は 7 なので、a <= 7(7 以下)だけが true です。< や > は境界の 7 を含まず false になります。","exp_en":"a is 7, so only a <= 7 is true. < and > exclude the boundary 7 and give false.","tag":"関係演算子"},{"id":"t2-016","theme":2,"type":"mc","q":"int型の値とdouble型の値を加算した結果のデータ型はどれか。","code":null,"choices":["`int`","`double`","`long`","`float`"],"answer":1,"exp_ja":"異なる型の算術演算では、範囲の広い型に揃えられます。int と double では double になります。","exp_en":"In mixed arithmetic the narrower type is promoted to the wider one. int plus double gives double.","tag":"型変換(キャスト)"},{"id":"t2-017","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int a = 7;\nint b = (a > 5) ? 10 : 20;\nSystem.out.println(b);","choices":["`10`","`20`","`7`","コンパイルエラーになる"],"answer":0,"exp_ja":"条件演算子 (条件 ? 値1 : 値2) は、条件が true なら値1、false なら値2になります。a > 5 は true なので 10 です。","exp_en":"The conditional operator (cond ? a : b) gives a if the condition is true and b otherwise. a > 5 is true, so the result is 10.","tag":"条件演算子"},{"id":"t2-018","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"System.out.println(10 - 4 / 2 + 1);","choices":["`4`","`9`","`5`","`8`"],"answer":1,"exp_ja":"先に除算 4 / 2 = 2 を計算し、10 - 2 + 1 を左から計算して 9 になります。","exp_en":"Division comes first (4 / 2 = 2), then 10 - 2 + 1 is evaluated left to right, giving 9.","tag":"演算子の優先順位"},{"id":"t2-019","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int a = 17;\na /= 5;\na %= 2;\nSystem.out.println(a);","choices":["`1`","`0`","`3`","`2`"],"answer":0,"exp_ja":"a /= 5 で 17 / 5 = 3(int の除算)、続く a %= 2 で 3 % 2 = 1 になります。","exp_en":"a /= 5 gives 17 / 5 = 3 (int division), and a %= 2 then gives 3 % 2 = 1.","tag":"代入演算子"},{"id":"t2-020","theme":2,"type":"mc","q":"変数の宣言と初期化として、正しいものはどれか。","code":null,"choices":["`integer x = 5;`","`int x == 5;`","`x int = 5;`","`int x = 5;`"],"answer":3,"exp_ja":"宣言は「データ型 変数名 = 値;」の順に書きます。整数型は int です。","exp_en":"A declaration is written as: type name = value;. The integer type is int.","tag":"基本データ型"},{"id":"t2-021","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"System.out.println(2 + 3 * 4);","choices":["`20`","`14`","`24`","`9`"],"answer":1,"exp_ja":"* は + より優先順位が高いので、先に 3 * 4 = 12 を計算し、2 + 12 = 14 になります。","exp_en":"* has higher precedence than +, so 3 * 4 = 12 is computed first, then 2 + 12 = 14.","tag":"演算子の優先順位"},{"id":"t2-022","theme":2,"type":"mc","q":"「以上」を表す関係演算子として、正しいものはどれか。","code":null,"choices":["`>=`","`=>`","`>`","`=<`"],"answer":0,"exp_ja":"「以上」は >=、「以下」は <= と書きます。=> や =< という演算子はありません。","exp_en":"\"Greater than or equal to\" is >=, and \"less than or equal to\" is <=. There are no operators => or =<.","tag":"関係演算子"},{"id":"t2-023","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int a = 7;\nint b = 2;\nSystem.out.println(a / b);","choices":["`3`","`3.5`","`4`","`3.0`"],"answer":0,"exp_ja":"int同士の除算は結果も int になり、小数部分は切り捨てられます。","exp_en":"Dividing an int by an int gives an int; the fractional part is discarded.","tag":"算術演算子"},{"id":"t2-024","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int x = 5;\nint y = x++ + ++x;\nSystem.out.println(y + \" \" + x);","choices":["`10 6`","`11 7`","`12 7`","`12 6`"],"answer":2,"exp_ja":"x++ は 5 を使ってから x を 6 にします。次に ++x は x を 7 にしてから 7 を使います。よって y = 5 + 7 = 12、x = 7 です。","exp_en":"x++ yields 5 and then x becomes 6. ++x makes x 7 and yields 7. So y = 5 + 7 = 12 and x = 7.","tag":"インクリメント・デクリメント"},{"id":"t2-025","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int x = 3;\nString s = (x % 2 == 0) ? \"even\" : \"odd\";\nSystem.out.println(s);","choices":["`even`","`odd`","`3`","コンパイルエラーになる"],"answer":1,"exp_ja":"x % 2 == 0 は 3 % 2 == 0 で false なので、条件演算子の結果は右側の \"odd\" になります。","exp_en":"x % 2 == 0 is false for 3, so the conditional operator yields the right-hand value, \"odd\".","tag":"条件演算子"},{"id":"t2-026","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"System.out.println(-7 % 3);","choices":["`1`","`2`","`-1`","`-2`"],"answer":2,"exp_ja":"剰余の符号は、割られる数(左辺)の符号に従います。-7 % 3 は -1 です。","exp_en":"The sign of the remainder follows the left operand. -7 % 3 is -1.","tag":"算術演算子"},{"id":"t2-027","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"enum Color { RED, GREEN, BLUE }\n\npublic class Main {\n    public static void main(String[] args) {\n        Color c = Color.GREEN;\n        System.out.println(c);\n    }\n}","choices":["`GREEN`","`1`","`Color.GREEN`","コンパイルエラーになる"],"answer":0,"exp_ja":"enum は決まった値の集まりを定義する型です。println で enum の値を表示すると、定数名 GREEN が出力されます。","exp_en":"An enum defines a fixed set of constants. Printing an enum value shows its constant name, GREEN.","tag":"enum"},{"id":"t2-028","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"System.out.println(10 / 4 * 2.0);","choices":["`5.0`","`4.0`","`4`","`5`"],"answer":1,"exp_ja":"左から計算します。10 / 4 は int同士で 2、その後 2 * 2.0 で 4.0 になります。","exp_en":"Evaluation goes left to right. 10 / 4 is 2 (int division), then 2 * 2.0 is 4.0.","tag":"演算子の優先順位"},{"id":"t2-029","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"System.out.println('a' + 1);","choices":["`b`","`a1`","`98`","コンパイルエラーになる"],"answer":2,"exp_ja":"char と int の加算は int になります。'a' の文字コード 97 に 1 を足して 98 です。","exp_en":"Adding a char and an int gives an int. The code of 'a' is 97, so the result is 98.","tag":"型変換(キャスト)"},{"id":"t2-030","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"System.out.println((char) ('a' + 1));","choices":["`a`","`b`","`98`","`c`"],"answer":1,"exp_ja":"'a' + 1 は 98(int)ですが、(char) にキャストすると文字 b になります。","exp_en":"'a' + 1 is the int 98, but casting it to char gives the character b.","tag":"型変換(キャスト)"},{"id":"t2-031","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"System.out.println(1 + 2 + \"A\");","choices":["`3A`","`12A`","`A3`","`A12`"],"answer":0,"exp_ja":"左から順に計算します。1 + 2 が先に 3 になり、その後に文字列 \"A\" と連結されます。","exp_en":"Evaluated left to right: 1 + 2 becomes 3 first, then it is concatenated with \"A\".","tag":"文字列の連結"},{"id":"t2-032","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"System.out.println(\"A\" + 1 + 2);","choices":["`A3`","`3A`","`A12`","`12A`"],"answer":2,"exp_ja":"左端が文字列なので、\"A\" + 1 は \"A1\"、続いて \"A1\" + 2 は \"A12\" になります。","exp_en":"The left operand is a String, so \"A\" + 1 is \"A1\" and then \"A1\" + 2 is \"A12\".","tag":"文字列の連結"},{"id":"t2-033","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int a = 3;\nint b = a++ * 2;\nSystem.out.println(a + \" \" + b);","choices":["`3 6`","`4 8`","`4 6`","`3 8`"],"answer":2,"exp_ja":"後置の a++ は、3 を使ってから a を 4 にします。b = 3 * 2 = 6、a = 4 です。","exp_en":"Postfix a++ uses 3 and then increments a to 4. So b = 3 * 2 = 6 and a = 4.","tag":"インクリメント・デクリメント"},{"id":"t2-034","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"System.out.println((int) 3.9);","choices":["`3`","`4`","`3.9`","`3.0`"],"answer":0,"exp_ja":"(int) へのキャストは小数部分を切り捨てます(四捨五入ではありません)。","exp_en":"Casting to int truncates the fractional part; it does not round.","tag":"型変換(キャスト)"},{"id":"t2-035","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int x = 10;\nSystem.out.println((x > 10) + \" \" + (x >= 10) + \" \" + (x <= 10));","choices":["`false true true`","`true true true`","`false false true`","`false true false`"],"answer":0,"exp_ja":"x は 10 です。x > 10 は false、x >= 10 は true、x <= 10 は true になります。境界の値に注意します。","exp_en":"x is 10. x > 10 is false, x >= 10 is true, and x <= 10 is true. Watch the boundary value.","tag":"関係演算子"},{"id":"t2-036","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"byte b = (byte) 200;\nSystem.out.println(b);","choices":["`200`","`127`","`-56`","`56`"],"answer":2,"exp_ja":"200 は byte の範囲(最大 127)を超えるため、キャストすると値が一巡して -56 になります。","exp_en":"200 exceeds the byte range (max 127), so the cast wraps around to -56.","tag":"型変換(キャスト)"},{"id":"t2-037","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int max = Integer.MAX_VALUE;\nSystem.out.println(max + 1);","choices":["`2147483648`","`-2147483648`","`0`","`-1`"],"answer":1,"exp_ja":"int の最大値に 1 を足すと、オーバーフローして最小値 -2147483648 になります。","exp_en":"Adding 1 to the int maximum overflows and wraps to the minimum, -2147483648.","tag":"基本データ型"},{"id":"t2-038","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"boolean r = true || false && false;\nSystem.out.println(r);","choices":["`true`","`false`","コンパイルエラーになる","実行時エラーになる"],"answer":0,"exp_ja":"&& は || より優先順位が高いので、true || (false && false) の順に評価され、結果は true です。","exp_en":"&& has higher precedence than ||, so it is evaluated as true || (false && false), which is true.","tag":"演算子の優先順位"},{"id":"t2-039","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int x = 0;\nboolean r = (x != 0) && (10 / x > 1);\nSystem.out.println(r);","choices":["`true`","`false`","実行時に ArithmeticException が発生する","コンパイルエラーになる"],"answer":1,"exp_ja":"左辺 x != 0 が false なので、短絡評価により右辺(0 で割る式)は実行されず、結果は false です。","exp_en":"The left side x != 0 is false, so short-circuiting skips the right side (division by zero). The result is false.","tag":"論理演算子"},{"id":"t2-040","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"double d = 10 / 4;\nSystem.out.println(d);","choices":["`2`","`2.0`","`2.5`","`3.0`"],"answer":1,"exp_ja":"右辺 10 / 4 は int同士の除算で 2 になり、それが double に変換されて 2.0 になります。","exp_en":"10 / 4 is int division giving 2, which is then widened to the double 2.0.","tag":"型変換(キャスト)"},{"id":"t2-041","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int a = 5;\nint b = 0;\nSystem.out.println(a / b);","choices":["`0`","`Infinity`","実行時に ArithmeticException が発生する","コンパイルエラーになる"],"answer":2,"exp_ja":"整数を 0 で割ると、実行時に ArithmeticException が発生します。","exp_en":"Dividing an integer by zero throws an ArithmeticException at runtime.","tag":"算術演算子"},{"id":"t2-042","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"System.out.println(5.0 / 0);","choices":["`0`","`Infinity`","実行時に ArithmeticException が発生する","コンパイルエラーになる"],"answer":1,"exp_ja":"浮動小数点数を 0 で割っても例外にはならず、Infinity(無限大)になります。","exp_en":"Dividing a floating-point number by zero does not throw; the result is Infinity.","tag":"算術演算子"},{"id":"t2-043","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"short s = 10;\ns = s + 1;\nSystem.out.println(s);","choices":["`11`","`10`","実行時エラーになる","コンパイルエラーになる"],"answer":3,"exp_ja":"s + 1 は int型になるため、キャストなしで short型の s に代入するとコンパイルエラーです。(s += 1 と書くとエラーになりません。)","exp_en":"s + 1 is an int, so assigning it to a short without a cast is a compile error. (s += 1 would compile.)","tag":"型変換(キャスト)"},{"id":"t2-044","theme":2,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"float f = 1.5f;\ndouble d = f * 2;\nSystem.out.println(d);","choices":["`3`","`3.0`","`3.0f`","コンパイルエラーになる"],"answer":1,"exp_ja":"f * 2 は float の 3.0 になり、double に代入されて 3.0 と表示されます。","exp_en":"f * 2 is the float 3.0, which is widened to a double and printed as 3.0.","tag":"型変換(キャスト)"},{"id":"t2-045","theme":2,"type":"fill","q":"実行結果が 3.5 になるように、空欄に入るデータ型を選べ。","code":"double r = (____) 7 / 2;\nSystem.out.println(r);","choices":["`double`","`int`","`long`","`String`"],"answer":0,"exp_ja":"(double) 7 とキャストすると、7.0 / 2 の計算になり 3.5 になります。int や long では 7 / 2 が先に 3 になります。","exp_en":"Casting with (double) makes it 7.0 / 2, which is 3.5. With int or long, 7 / 2 becomes 3 first.","tag":"型変換(キャスト)"},{"id":"t2-046","theme":2,"type":"fill","q":"実行結果が 8 になるように、空欄に入る演算子を選べ。","code":"int a = 5;\na ____ 3;\nSystem.out.println(a);","choices":["`+=`","`-=`","`*=`","`=+`"],"answer":0,"exp_ja":"a += 3 は a = a + 3 なので 8 になります。","exp_en":"a += 3 means a = a + 3, which is 8.","tag":"代入演算子"},{"id":"t2-047","theme":2,"type":"fill","q":"実行結果が false になるように、空欄に入る演算子を選べ。","code":"int a = 5;\nint b = 5;\nboolean r = (a > 3) ____ (b < 3);\nSystem.out.println(r);","choices":["`||`","`&&`","`!=`","`+`"],"answer":1,"exp_ja":"(a > 3) は true、(b < 3) は false です。&&(かつ)なら false になります。|| や != だと true です。","exp_en":"(a > 3) is true and (b < 3) is false. && gives false, while || and != give true.","tag":"論理演算子"},{"id":"t2-048","theme":2,"type":"fill","q":"実行結果が 1 になるように、空欄に入る演算子を選べ。","code":"int a = 10;\nint b = 3;\nSystem.out.println(a ____ b);","choices":["`/`","`*`","`-`","`%`"],"answer":3,"exp_ja":"10 を 3 で割った余りは 1 です。","exp_en":"The remainder of 10 divided by 3 is 1.","tag":"算術演算子"},{"id":"t2-049","theme":2,"type":"fill","q":"実行結果が b になるように、空欄に入るものを選べ。","code":"char c = 'a';\nc ____;\nSystem.out.println(c);","choices":["`--`","`++`","`+= 2`","`-= 2`"],"answer":1,"exp_ja":"char型にも ++ が使え、'a' の次の文字 'b' になります。","exp_en":"++ also works on char and moves 'a' to the next character, 'b'.","tag":"インクリメント・デクリメント"},{"id":"t2-050","theme":2,"type":"fill","q":"定数を宣言するための空欄に入るキーワードはどれか。","code":"____ int LIMIT = 100;\nSystem.out.println(LIMIT);","choices":["`static`","`const`","`final`","`constant`"],"answer":2,"exp_ja":"Javaで定数を宣言するには final を使います。const は予約語ですが使用できません。","exp_en":"Use final to declare a constant in Java. const is reserved but cannot be used.","tag":"基本データ型"},{"id":"t3-001","theme":3,"type":"tf","q":"if文の条件式には boolean型の式を書く必要があるため、if (1) { ... } はコンパイルエラーになる。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"Javaでは、条件式は true か false になる式でなければなりません。整数 1 は条件として使えません。","exp_en":"A condition must be a boolean expression. The integer 1 cannot be used as a condition in Java.","tag":"if"},{"id":"t3-002","theme":3,"type":"tf","q":"switch文では、case の処理に break がないと、続く case の処理も実行される。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"break がなければ、次の case の処理へ続けて実行されます(フォールスルー)。","exp_en":"Without break, execution falls through into the next case.","tag":"switch"},{"id":"t3-003","theme":3,"type":"tf","q":"switch文の default は、省略することができる。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"default は、どの case にも一致しない場合の処理で、書かなくても構いません。","exp_en":"default handles the case where no label matches, and it may be omitted.","tag":"switch"},{"id":"t3-004","theme":3,"type":"tf","q":"switch文の式には、String型を使用できる。(Java SE 7 以降)","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"Java SE 7 以降、switch の式に String を使えます。Java SE 8 でも使用できます。","exp_en":"Since Java SE 7, a String can be used as the switch expression. This includes Java SE 8.","tag":"switch"},{"id":"t3-005","theme":3,"type":"tf","q":"switch文の式には、double型を使用できる。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"switch の式には、byte、short、char、int、String、enum などを使えます。double は使えません。","exp_en":"The switch expression can be byte, short, char, int, String, or enum, but not double.","tag":"switch"},{"id":"t3-006","theme":3,"type":"tf","q":"for文の初期化・条件式・更新式は、すべて省略できる。(例: for (;;) { ... })","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"3つの部分はどれも省略可能です。条件式を省略すると、常に true として扱われ、無限ループになります。","exp_en":"All three parts may be omitted. An omitted condition is treated as true, giving an infinite loop.","tag":"for"},{"id":"t3-007","theme":3,"type":"tf","q":"do-while文では、条件式が最初から false であっても、繰り返しの処理が1回は実行される。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"do-while は処理を実行した後で条件を判定するため、必ず1回は実行されます。","exp_en":"do-while checks the condition after the body, so the body always runs at least once.","tag":"do-while"},{"id":"t3-008","theme":3,"type":"tf","q":"continue文は、ループ全体を終了させる。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"continue は、その回の残りの処理を飛ばして、次の繰り返しへ進みます。ループを終了させるのは break です。","exp_en":"continue skips the rest of the current iteration and moves on to the next one. break ends the loop.","tag":"continue"},{"id":"t3-009","theme":3,"type":"tf","q":"拡張for文では、配列の要素を、添字を使わずに先頭から順に取り出せる。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"for (int v : a) のように書くと、配列 a の要素が順に v に入ります。","exp_en":"Writing for (int v : a) assigns each element of array a to v in order.","tag":"拡張for"},{"id":"t3-010","theme":3,"type":"tf","q":"基本データ型の配列に対する拡張for文で、ループ変数に値を代入すると、配列の要素も書き換わる。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"ループ変数は要素のコピーなので、代入しても配列の要素は変わりません。","exp_en":"The loop variable is a copy of the element, so assigning to it does not change the array.","tag":"拡張for"},{"id":"t3-011","theme":3,"type":"mc","q":"if文の書き方として、正しいものはどれか。","code":null,"choices":["`if (a > 0) { }`","`if a > 0 { }`","`if (a > 0) then { }`","`if {a > 0}`"],"answer":0,"exp_ja":"条件式は括弧 ( ) で囲み、その後に処理を書きます。then は使いません。","exp_en":"The condition goes in parentheses, followed by the body. There is no then keyword.","tag":"if"},{"id":"t3-012","theme":3,"type":"mc","q":"次の for 文で、初期化式 int i = 0 が実行される回数はどれか。\n\n`for (int i = 0; i < 3; i++) { }`","code":null,"choices":["1回","3回","4回","0回"],"answer":0,"exp_ja":"初期化式は、ループの開始時に1回だけ実行されます。","exp_en":"The initialization runs only once, when the loop starts.","tag":"for"},{"id":"t3-013","theme":3,"type":"mc","q":"ループを途中で終了させるキーワードはどれか。","code":null,"choices":["`break`","`continue`","`exit`","`stop`"],"answer":0,"exp_ja":"break はループ(や switch)を抜けます。continue は次の繰り返しへ進むだけです。","exp_en":"break leaves the loop (or switch). continue only moves to the next iteration.","tag":"break"},{"id":"t3-014","theme":3,"type":"mc","q":"ループの残りの処理を飛ばして、次の繰り返しへ進むキーワードはどれか。","code":null,"choices":["`break`","`return`","`continue`","`skip`"],"answer":2,"exp_ja":"continue は、その回の残りの処理を飛ばして次の繰り返しに進みます。","exp_en":"continue skips the rest of the current iteration and proceeds to the next one.","tag":"continue"},{"id":"t3-015","theme":3,"type":"mc","q":"条件式の判定を、繰り返しの処理の後に行う繰り返し文はどれか。","code":null,"choices":["`for`","`while`","`do-while`","`switch`"],"answer":2,"exp_ja":"do-while は、処理を実行した後で条件を判定します。","exp_en":"do-while evaluates its condition after executing the body.","tag":"do-while"},{"id":"t3-016","theme":3,"type":"mc","q":"int型の配列 a の全要素を順に取り出す拡張for文として、正しいものはどれか。","code":null,"choices":["`for (int v : a) { }`","`for (int v in a) { }`","`for (v : a) { }`","`foreach (int v : a) { }`"],"answer":0,"exp_ja":"拡張for文は、for (型 変数 : 配列) の形で書きます。","exp_en":"The enhanced for statement is written as for (type variable : array).","tag":"拡張for"},{"id":"t3-017","theme":3,"type":"mc","q":"メソッドの処理を終了し、呼び出し元へ戻る(値を返す場合もある)キーワードはどれか。","code":null,"choices":["`break`","`return`","`exit`","`back`"],"answer":1,"exp_ja":"return は、メソッドを終了して呼び出し元に戻ります。値を返すこともできます。","exp_en":"return ends the method and goes back to the caller, optionally returning a value.","tag":"return"},{"id":"t3-018","theme":3,"type":"mc","q":"次のうち、無限ループになるものはどれか。","code":null,"choices":["`for (int i = 0; i < 3; i++) { }`","`while (true) { }`","`do { } while (false);`","`for (int i = 0; i < 0; i++) { }`"],"answer":1,"exp_ja":"while (true) は条件が常に true で、break などがなければ終わりません。","exp_en":"while (true) never ends unless something like break stops it.","tag":"while"},{"id":"t3-019","theme":3,"type":"mc","q":"switch文で、どの case にも一致しない場合に実行される部分を表すラベルはどれか。","code":null,"choices":["`else:`","`default:`","`otherwise:`","`other:`"],"answer":1,"exp_ja":"どの case にも一致しないときの処理は default: に書きます。","exp_en":"Processing for the case where nothing matches goes under default:.","tag":"switch"},{"id":"t3-020","theme":3,"type":"mc","q":"while文の条件式に使える式のデータ型はどれか。","code":null,"choices":["`int`","`boolean`","`String`","`char`"],"answer":1,"exp_ja":"条件式は boolean型(true または false)になる式でなければなりません。","exp_en":"A loop condition must be an expression of type boolean (true or false).","tag":"while"},{"id":"t3-021","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"int score = 75;\nif (score >= 90) {\n    System.out.println(\"A\");\n} else if (score >= 70) {\n    System.out.println(\"B\");\n} else {\n    System.out.println(\"C\");\n}","choices":["`A`","`B`","`C`","`AB`"],"answer":1,"exp_ja":"score >= 90 は false、次の score >= 70 は true なので B が表示され、else は実行されません。","exp_en":"score >= 90 is false and score >= 70 is true, so B is printed and the else branch is skipped.","tag":"if"},{"id":"t3-022","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"int a = 1;\nif (a > 3)\n    System.out.print(\"X\");\n    System.out.print(\"Y\");","choices":["`X`","`Y`","`XY`","何も表示されない"],"answer":1,"exp_ja":"{ } がない if は、直後の1文だけが対象です。Y の出力は if の外にあるので、常に実行されます。","exp_en":"Without braces, the if applies only to the next statement. The statement printing Y is outside it and always runs.","tag":"if"},{"id":"t3-023","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"int n = 2;\nswitch (n) {\n    case 1: System.out.print(\"A\");\n    case 2: System.out.print(\"B\");\n    case 3: System.out.print(\"C\"); break;\n    default: System.out.print(\"D\");\n}","choices":["`B`","`BC`","`BCD`","`ABC`"],"answer":1,"exp_ja":"case 2 から実行が始まり、break がないので case 3 に続けて実行され、そこで break により終了します。","exp_en":"Execution starts at case 2, falls through to case 3 because there is no break, and stops at that break.","tag":"switch"},{"id":"t3-024","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"int n = 5;\nswitch (n) {\n    case 1: System.out.print(\"A\"); break;\n    default: System.out.print(\"D\");\n    case 2: System.out.print(\"B\"); break;\n}","choices":["`D`","`DB`","`B`","`DBA`"],"answer":1,"exp_ja":"5 はどの case にも一致しないので default から実行します。default に break がないため、続く case 2 の処理も実行され、DB になります。","exp_en":"5 matches no case, so default runs. It has no break, so execution falls through into case 2, giving DB.","tag":"switch"},{"id":"t3-025","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"String s = \"b\";\nswitch (s) {\n    case \"a\": System.out.print(\"1\"); break;\n    case \"b\": System.out.print(\"2\");\n    case \"c\": System.out.print(\"3\"); break;\n    default: System.out.print(\"4\");\n}","choices":["`2`","`23`","`234`","`3`"],"answer":1,"exp_ja":"case \"b\" から実行し、break がないので case \"c\" の 3 も出力して、そこで break します。","exp_en":"Execution starts at case \"b\", falls through to case \"c\" and prints 3, then stops at its break.","tag":"switch"},{"id":"t3-026","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"int sum = 0;\nfor (int i = 1; i <= 5; i++) {\n    if (i % 2 == 0) {\n        continue;\n    }\n    sum += i;\n}\nSystem.out.println(sum);","choices":["`6`","`9`","`12`","`15`"],"answer":1,"exp_ja":"偶数のときは continue で加算を飛ばすので、1 + 3 + 5 = 9 になります。","exp_en":"continue skips the addition for even numbers, so the sum is 1 + 3 + 5 = 9.","tag":"continue"},{"id":"t3-027","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"for (int i = 0; i < 3; i++) {\n    System.out.print(i);\n}","choices":["`012`","`0123`","`123`","`1234`"],"answer":0,"exp_ja":"i は 0、1、2 の間だけ繰り返され、3 になった時点で条件 i < 3 が false になります。","exp_en":"i takes 0, 1, 2, and the loop ends when i becomes 3 because i < 3 is false.","tag":"for"},{"id":"t3-028","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"for (int i = 5; i > 0; i -= 2) {\n    System.out.print(i + \" \");\n}","choices":["`5 3 1`","`5 3`","`5 3 1 -1`","`4 2 0`"],"answer":0,"exp_ja":"i は 5、3、1 と 2 ずつ減り、次は -1 で i > 0 が false になるため終了します。","exp_en":"i goes 5, 3, 1 in steps of 2, and the loop ends at -1 because i > 0 is false.","tag":"for"},{"id":"t3-029","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"int count = 0;\nfor (int i = 0; i < 3; i++) {\n    for (int j = 0; j < 2; j++) {\n        count++;\n    }\n}\nSystem.out.println(count);","choices":["`5`","`6`","`3`","`2`"],"answer":1,"exp_ja":"外側が3回、内側が2回なので、count++ は 3 × 2 = 6 回実行されます。","exp_en":"The outer loop runs 3 times and the inner loop 2 times, so count++ runs 3 x 2 = 6 times.","tag":"for"},{"id":"t3-030","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"int i = 0;\nint sum = 0;\nwhile (i < 4) {\n    sum += i;\n    i++;\n}\nSystem.out.println(sum);","choices":["`6`","`10`","`4`","`3`"],"answer":0,"exp_ja":"i が 0、1、2、3 のときに加算するので、0 + 1 + 2 + 3 = 6 です。","exp_en":"It adds when i is 0, 1, 2, 3, so the sum is 0 + 1 + 2 + 3 = 6.","tag":"while"},{"id":"t3-031","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"int n = 10;\ndo {\n    System.out.print(n);\n    n++;\n} while (n < 10);","choices":["`10`","何も表示されない","`1011`","`9`"],"answer":0,"exp_ja":"do-while は先に処理を実行するので 10 が1回表示され、その後の判定 n < 10 が false で終了します。","exp_en":"do-while runs the body first, printing 10 once, and then ends because n < 10 is false.","tag":"do-while"},{"id":"t3-032","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"for (int i = 1; i <= 5; i++) {\n    if (i == 3) {\n        break;\n    }\n    System.out.print(i);\n}","choices":["`12`","`123`","`1245`","`12345`"],"answer":0,"exp_ja":"i が 3 になった時点で break によりループを抜けるので、1 と 2 だけが表示されます。","exp_en":"When i becomes 3, break leaves the loop, so only 1 and 2 are printed.","tag":"break"},{"id":"t3-033","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"for (int i = 1; i <= 5; i++) {\n    if (i == 3) {\n        continue;\n    }\n    System.out.print(i);\n}","choices":["`12`","`123`","`1245`","`12345`"],"answer":2,"exp_ja":"i が 3 のときだけ continue で出力を飛ばし、次の繰り返しへ進むので 1245 になります。","exp_en":"Only when i is 3, continue skips the output and moves on, so the result is 1245.","tag":"continue"},{"id":"t3-034","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"for (int i = 0; i < 3; i++) {\n    for (int j = 0; j < 3; j++) {\n        if (j == 1) {\n            break;\n        }\n        System.out.print(i + \"\" + j + \" \");\n    }\n}","choices":["`00 10 20`","`00 01 02`","`00 11 22`","`00`"],"answer":0,"exp_ja":"break は内側のループだけを抜けます。j が 1 になると内側が終わり、i が進んで、00 10 20 になります。","exp_en":"break leaves only the inner loop. When j reaches 1 the inner loop ends and i advances, giving 00 10 20.","tag":"break"},{"id":"t3-035","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"int n = 0;\nwhile (true) {\n    n++;\n    if (n >= 3) {\n        break;\n    }\n}\nSystem.out.println(n);","choices":["`2`","`3`","`4`","無限ループになる"],"answer":1,"exp_ja":"n が 3 になったときに break で while (true) を抜けるので、3 が表示されます。","exp_en":"When n reaches 3, break exits the while (true) loop, so 3 is printed.","tag":"while"},{"id":"t3-036","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"int[] a = {1, 2, 3};\nint sum = 0;\nfor (int v : a) {\n    sum += v;\n}\nSystem.out.println(sum);","choices":["`3`","`6`","`123`","`0`"],"answer":1,"exp_ja":"拡張for文で 1、2、3 を順に加算するので、合計は 6 です。","exp_en":"The enhanced for loop adds 1, 2, 3 in turn, so the total is 6.","tag":"拡張for"},{"id":"t3-037","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"int[] a = {1, 2, 3};\nfor (int v : a) {\n    v = v * 2;\n}\nSystem.out.println(a[0] + \" \" + a[1] + \" \" + a[2]);","choices":["`2 4 6`","`1 2 3`","`0 0 0`","コンパイルエラーになる"],"answer":1,"exp_ja":"v は各要素のコピーです。v を変更しても配列 a の要素は変わらないので、1 2 3 のままです。","exp_en":"v is a copy of each element. Changing v does not change array a, so it stays 1 2 3.","tag":"拡張for"},{"id":"t3-038","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    static int twice(int n) {\n        return n * 2;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(twice(3) + twice(4));\n    }\n}","choices":["`10`","`12`","`14`","`68`"],"answer":2,"exp_ja":"twice(3) は 6、twice(4) は 8 を返すので、合計は 14 です。","exp_en":"twice(3) returns 6 and twice(4) returns 8, so the sum is 14.","tag":"return"},{"id":"t3-039","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    static int find(int[] a, int t) {\n        for (int i = 0; i < a.length; i++) {\n            if (a[i] == t) {\n                return i;\n            }\n        }\n        return -1;\n    }\n\n    public static void main(String[] args) {\n        int[] a = {5, 8, 3};\n        System.out.println(find(a, 3) + \" \" + find(a, 9));\n    }\n}","choices":["`2 -1`","`3 -1`","`2 0`","`1 -1`"],"answer":0,"exp_ja":"3 は添字 2 にあるので find(a, 3) は 2 を返します。9 は見つからず、ループ後の return -1 で -1 を返します。","exp_en":"3 is at index 2, so find(a, 3) returns 2. 9 is not found, so the final return -1 gives -1.","tag":"return"},{"id":"t3-040","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"public class Main {\n    static void show(int n) {\n        if (n < 0) {\n            return;\n        }\n        System.out.print(n);\n    }\n\n    public static void main(String[] args) {\n        show(-1);\n        show(2);\n        show(-3);\n        show(4);\n    }\n}","choices":["`24`","`-12-34`","`2`","`-1`"],"answer":0,"exp_ja":"n が負のときは return でメソッドを途中で終了し、何も表示しません。表示されるのは 2 と 4 です。","exp_en":"When n is negative, return ends the method early with no output. Only 2 and 4 are printed.","tag":"return"},{"id":"t3-041","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"for (int i = 0; i < 3; i++) {\n    switch (i) {\n        case 1: break;\n        default: System.out.print(i);\n    }\n    System.out.print(\"-\");\n}","choices":["`0-2-`","`0--2-`","`0-`","`0`"],"answer":1,"exp_ja":"switch 内の break は switch だけを抜けます。i = 1 のときは何も出力せず、その後の - だけが出力されるので 0--2- になります。","exp_en":"break inside switch leaves only the switch. For i = 1 only the following - is printed, giving 0--2-.","tag":"switch"},{"id":"t3-042","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"for (int i = 0; i < 3; i++) {\n}\nSystem.out.println(i);","choices":["`3`","`2`","実行時エラーになる","コンパイルエラーになる"],"answer":3,"exp_ja":"i は for文の中で宣言した変数なので、for文の外では使えません。コンパイルエラーになります。","exp_en":"i is declared inside the for statement, so it cannot be used outside it. This is a compile error.","tag":"for"},{"id":"t3-043","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"int a = 0;\nif (a = 1) {\n    System.out.println(\"one\");\n}","choices":["`one`","何も表示されない","実行時エラーになる","コンパイルエラーになる"],"answer":3,"exp_ja":"a = 1 は代入式で、結果は int型です。条件式は boolean型でなければならないので、コンパイルエラーです。","exp_en":"a = 1 is an assignment whose value is an int. A condition must be boolean, so this is a compile error.","tag":"if"},{"id":"t3-044","theme":3,"type":"output","q":"次のコードを実行したときの出力はどれか。","code":"for (int i = 1; i <= 6; i++) {\n    if (i % 3 == 0) {\n        System.out.print(\"F\");\n    } else {\n        System.out.print(i);\n    }\n}","choices":["`12345F`","`12F45F`","`FF`","`123456`"],"answer":1,"exp_ja":"i が 3 の倍数(3 と 6)のときは F を、それ以外は i を表示するので、12F45F になります。","exp_en":"For multiples of 3 (3 and 6) F is printed, otherwise i, giving 12F45F.","tag":"if"},{"id":"t3-045","theme":3,"type":"fill","q":"実行結果が 0123 になるように、空欄に入る条件式を選べ。","code":"for (int i = 0; ____; i++) {\n    System.out.print(i);\n}","choices":["`i < 4`","`i <= 4`","`i < 3`","`i != 5`"],"answer":0,"exp_ja":"i が 0、1、2、3 の間だけ繰り返すので、条件は i < 4 です。i <= 4 や i != 5 では 01234 になります。","exp_en":"The loop must run while i is 0 to 3, so the condition is i < 4. i <= 4 or i != 5 would print 01234.","tag":"for"},{"id":"t3-046","theme":3,"type":"fill","q":"実行結果が 036 になるように、空欄に入る条件式を選べ。","code":"int i = 0;\nwhile (____) {\n    System.out.print(i);\n    i += 3;\n}","choices":["`i < 6`","`i < 7`","`i <= 9`","`i < 10`"],"answer":1,"exp_ja":"i は 0、3、6 と増え、次の 9 では繰り返しを終える必要があるので、i < 7 です。","exp_en":"i goes 0, 3, 6, and the loop must stop at 9, so the condition is i < 7.","tag":"while"},{"id":"t3-047","theme":3,"type":"fill","q":"実行結果が 12 になるように、空欄に入るキーワードを選べ。","code":"for (int i = 1; i <= 5; i++) {\n    if (i == 3) {\n        ____;\n    }\n    System.out.print(i);\n}","choices":["`continue`","`break`","`skip`","`stop`"],"answer":1,"exp_ja":"i が 3 でループを終了する break を入れると、12 だけが表示されます。continue だと 1245 になります。","exp_en":"break ends the loop at 3, so only 12 is printed. continue would print 1245.","tag":"break"},{"id":"t3-048","theme":3,"type":"fill","q":"実行結果が 1245 になるように、空欄に入るキーワードを選べ。","code":"for (int i = 1; i <= 5; i++) {\n    if (i == 3) {\n        ____;\n    }\n    System.out.print(i);\n}","choices":["`break`","`next`","`skip`","`continue`"],"answer":3,"exp_ja":"i が 3 のときだけ出力を飛ばして次へ進むのは continue です。","exp_en":"continue skips the output only when i is 3 and moves on to the next iteration.","tag":"continue"},{"id":"t3-049","theme":3,"type":"fill","q":"実行結果が 6 になるように、空欄に入る記述を選べ。","code":"int[] a = {3, 1, 2};\nint sum = 0;\nfor (____) {\n    sum += v;\n}\nSystem.out.println(sum);","choices":["`int v in a`","`int v : a`","`int v = a`","`v : a`"],"answer":1,"exp_ja":"拡張for文は、for (型 変数 : 配列) の形で書きます。","exp_en":"The enhanced for statement has the form for (type variable : array).","tag":"拡張for"},{"id":"t3-050","theme":3,"type":"fill","q":"実行結果が 3 になるように、空欄に入るキーワードを選べ。","code":"int n = 0;\ndo {\n    n++;\n} ____ (n < 3);\nSystem.out.println(n);","choices":["`until`","`if`","`while`","`for`"],"answer":2,"exp_ja":"do { ... } while (条件); の形で書きます。n が 3 になるまで繰り返します。","exp_en":"It is written as do { ... } while (condition);. The loop repeats until n reaches 3.","tag":"do-while"},{"id":"t4-001","theme":4,"type":"tf","q":"配列を生成した後で、その配列の要素数を変更することはできない。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"配列の要素数は生成時に決まり、後から増減できません。","exp_en":"The size of an array is fixed when it is created and cannot be changed later.","tag":"配列の宣言・生成"},{"id":"t4-002","theme":4,"type":"tf","q":"int[] a = new int[3]; で生成した配列の各要素の初期値は 0 である。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"int型の配列は、要素が自動的に 0 で初期化されます。","exp_en":"Elements of an int array are automatically initialized to 0.","tag":"初期値"},{"id":"t4-003","theme":4,"type":"tf","q":"String[] s = new String[2]; で生成した配列の各要素の初期値は、空文字(長さ0の文字列)である。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"参照型の配列の要素は null で初期化されます。空文字ではありません。","exp_en":"Elements of a reference-type array are initialized to null, not to an empty string.","tag":"初期値"},{"id":"t4-004","theme":4,"type":"tf","q":"配列の最初の要素の添字は 1 である。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"添字は 0 から始まります。最初の要素は a[0] です。","exp_en":"Indexes start at 0. The first element is a[0].","tag":"添字とlength"},{"id":"t4-005","theme":4,"type":"tf","q":"配列 a の要素数は、a.length() で取得する。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"配列の要素数は、メソッドではなくフィールドなので a.length と書きます(括弧は付けません)。","exp_en":"The size of an array is a field, so write a.length without parentheses.","tag":"添字とlength"},{"id":"t4-006","theme":4,"type":"tf","q":"配列は参照型であり、配列を代入した変数には、配列オブジェクトへの参照が入る。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"配列変数が保持するのは配列そのものではなく、配列オブジェクトの場所(参照)です。","exp_en":"An array variable holds a reference to the array object, not the array itself.","tag":"配列の参照"},{"id":"t4-007","theme":4,"type":"tf","q":"int[] b = a; と書くと、配列 a の内容が複製され、別の配列が作られる。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"参照がコピーされるだけで、a と b は同じ配列を指します。複製は作られません。","exp_en":"Only the reference is copied, so a and b point to the same array. No duplicate is created.","tag":"配列の参照"},{"id":"t4-008","theme":4,"type":"tf","q":"int a[] = new int[3]; は、int[] a = new int[3]; と同じ意味の正しい宣言である。","code":null,"choices":["正しい","誤っている"],"answer":0,"exp_ja":"配列の [ ] は、型名の後ろでも変数名の後ろでも書けます。","exp_en":"The [ ] may be written after the type name or after the variable name.","tag":"配列の宣言・生成"},{"id":"t4-009","theme":4,"type":"tf","q":"配列の添字が範囲外の場合は、コンパイルエラーになる。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"範囲外の添字はコンパイルでは検出されず、実行時に ArrayIndexOutOfBoundsException が発生します。","exp_en":"An out-of-range index is not caught at compile time; ArrayIndexOutOfBoundsException occurs at runtime.","tag":"添字とlength"},{"id":"t4-010","theme":4,"type":"tf","q":"Item[] items = new Item[2]; と書くと、2つの Item オブジェクトが生成され、items に格納される。","code":null,"choices":["正しい","誤っている"],"answer":1,"exp_ja":"生成されるのは参照を入れる配列だけで、各要素は null です。Item は別途 new で生成します。","exp_en":"Only the array of references is created, and each element is null. Each Item must be created with new.","tag":"オブジェクトの配列"},{"id":"t4-011","theme":4,"type":"mc","q":"配列の宣言・生成として、正しいものはどれか。","code":null,"choices":["`int[] a = new int[3]{1, 2, 3};`","`int a[] = {1, 2, 3};`","`int[3] a = new int[3];`","`int a = new int[3];`"],"answer":1,"exp_ja":"初期値を { } で並べる書き方は正しいです。アは要素数と初期値を同時に書いているのでエラー、ウは宣言側に要素数を書けず、エは左辺が int型なのでエラーです。","exp_en":"Listing initial values in { } is valid. A has both a size and values, C puts the size in the declaration, and D assigns an array to an int.","tag":"配列の宣言・生成"},{"id":"t4-012","theme":4,"type":"mc","q":"配列 a の要素数を取得する式はどれか。","code":null,"choices":["`a.length`","`a.length()`","`a.size()`","`a.count`"],"answer":0,"exp_ja":"配列の要素数は length フィールドで取得します。","exp_en":"The number of elements is obtained with the length field.","tag":"添字とlength"},{"id":"t4-013","theme":4,"type":"mc","q":"要素数が 5 の配列で、有効な添字の範囲はどれか。","code":null,"choices":["`1` 〜 `5`","`0` 〜 `5`","`0` 〜 `4`","`1` 〜 `4`"],"answer":2,"exp_ja":"添字は 0 から始まり、最後は 要素数 - 1 なので 0〜4 です。","exp_en":"Indexes start at 0 and end at size - 1, so they run from 0 to 4.","tag":"添字とlength"},{"id":"t4-014","theme":4,"type":"mc","q":"次のプログラムを実行したときの結果として、正しいものはどれか。\n\n`int[] a = new int[3];\na[3] = 1;`","code":null,"choices":["コンパイルエラーになる","実行時に ArrayIndexOutOfBoundsException が発生する","a[2] に 1 が代入される","何も起こらず正常に終了する"],"answer":1,"exp_ja":"要素数 3 の配列で有効な添字は 0〜2 です。添字 3 はコンパイルは通りますが、実行時に例外が発生します。","exp_en":"For an array of length 3, valid indexes are 0 to 2. Index 3 compiles but throws an exception at runtime.","tag":"添字とlength"},{"id":"t4-015","theme":4,"type":"mc","q":"boolean型の配列を new で生成したとき、各要素の初期値はどれか。","code":null,"choices":["`true`","`false`","`null`","`0`"],"answer":1,"exp_ja":"boolean型の初期値は false です。","exp_en":"The default value of boolean is false.","tag":"初期値"},{"id":"t4-016","theme":4,"type":"mc","q":"double型の配列を new で生成したとき、各要素の初期値はどれか。","code":null,"choices":["`0`","`0.0`","`null`","`NaN`"],"answer":1,"exp_ja":"double型の初期値は 0.0 です。","exp_en":"The default value of double is 0.0.","tag":"初期値"},{"id":"t4-017","theme":4,"type":"mc","q":"Item型の配列を new で生成したとき、各要素の初期値はどれか。","code":null,"choices":["`0`","`null`","空文字","`false`"],"answer":1,"exp_ja":"オブジェクトの配列(参照型の配列)の要素は null で初期化されます。","exp_en":"Elements of an object (reference-type) array are initialized to null.","tag":"オブジェクトの配列"},{"id":"t4-018","theme":4,"type":"mc","q":"配列の宣言・生成として、誤っているものはどれか。","code":null,"choices":["`int[] a;`","`int a[];`","`String[] s = new String[2];`","`int[] a = new int[];`"],"answer":3,"exp_ja":"new で配列を生成するときは、要素数または初期値を指定する必要があります。new int[] だけではエラーです。","exp_en":"When creating an array with new, a size or initial values must be given. new int[] alone is an error.","tag":"配列の宣言・生成"},{"id":"t4-019","theme":4,"type":"mc","q":"要素数 3 の int型配列を生成する式として、正しいものはどれか。","code":null,"choices":["`new int(3)`","`new int[3]`","`new int{3}`","`int[3]`"],"answer":1,"exp_ja":"配列の生成は new int[要素数] と書きます。","exp_en":"An array is created with new int[size].","tag":"配列の宣言・生成"},{"id":"t4-020","theme":4,"type":"mc","q":"配列 a = {10, 20, 30} の最後の要素を表す式として、正しいものはどれか。","code":null,"choices":["`a[3]`","`a[a.length]`","`a[a.length - 1]`","`a[-1]`"],"answer":2,"exp_ja":"最後の添字は 要素数 - 1 なので、a[a.length - 1] です。他は範囲外になります。","exp_en":"The last index is size - 1, so a[a.length - 1]. The others are out of range.","tag":"添字とlength"},{"id":"t4-021","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int[] a = {10, 20, 30};\nSystem.out.println(a.length + \" \" + a[1]);","choices":["`3 10`","`3 20`","`2 20`","`2 30`"],"answer":1,"exp_ja":"要素数は 3 で、添字は 0 から始まるので a[1] は 20 です。","exp_en":"The array has 3 elements, and indexes start at 0, so a[1] is 20.","tag":"添字とlength"},{"id":"t4-022","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int[] a = new int[3];\nSystem.out.println(a[0] + a[1] + a[2]);","choices":["`0`","`null`","`3`","コンパイルエラーになる"],"answer":0,"exp_ja":"int型配列の要素は 0 で初期化されるので、合計は 0 です。","exp_en":"The elements of an int array are initialized to 0, so the sum is 0.","tag":"初期値"},{"id":"t4-023","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"String[] s = new String[2];\nSystem.out.println(s[0]);","choices":["`null`","`0`","何も表示されない(空文字)","コンパイルエラーになる"],"answer":0,"exp_ja":"参照型の配列の要素は null で、println で表示すると null と出力されます。","exp_en":"Elements of a reference-type array are null, and println prints null.","tag":"初期値"},{"id":"t4-024","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"boolean[] b = new boolean[2];\ndouble[] d = new double[2];\nSystem.out.println(b[0] + \" \" + d[1]);","choices":["`false 0`","`false 0.0`","`true 0.0`","`null null`"],"answer":1,"exp_ja":"boolean の初期値は false、double の初期値は 0.0 です。","exp_en":"The defaults are false for boolean and 0.0 for double.","tag":"初期値"},{"id":"t4-025","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int[] a = {4, 7, 1};\nint sum = 0;\nfor (int i = 0; i < a.length; i++) {\n    sum += a[i];\n}\nSystem.out.println(sum);","choices":["`10`","`12`","`11`","`3`"],"answer":1,"exp_ja":"4 + 7 + 1 = 12 です。i が 0 から a.length - 1 まで進みます。","exp_en":"4 + 7 + 1 = 12. The index i runs from 0 to a.length - 1.","tag":"配列とループ"},{"id":"t4-026","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int[] a = {3, 9, 4};\nint max = a[0];\nfor (int i = 1; i < a.length; i++) {\n    if (a[i] > max) {\n        max = a[i];\n    }\n}\nSystem.out.println(max);","choices":["`3`","`4`","`9`","`16`"],"answer":2,"exp_ja":"先頭を最大値と仮定し、より大きい要素があれば更新するので、最大値の 9 になります。","exp_en":"It assumes the first element is the maximum and updates it for larger values, ending with 9.","tag":"配列とループ"},{"id":"t4-027","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int[] a = {1, 2, 3};\nfor (int i = a.length - 1; i >= 0; i--) {\n    System.out.print(a[i]);\n}","choices":["`123`","`321`","`32`","`210`"],"answer":1,"exp_ja":"i が 2、1、0 と減るので、a[2]、a[1]、a[0] の順に 3、2、1 が表示されます。","exp_en":"i goes 2, 1, 0, so a[2], a[1], a[0] are printed as 3, 2, 1.","tag":"配列とループ"},{"id":"t4-028","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int[] a = {5, 6, 7};\nint t = a[0];\na[0] = a[2];\na[2] = t;\nSystem.out.println(a[0] + \"\" + a[1] + a[2]);","choices":["`567`","`765`","`675`","`18`"],"answer":1,"exp_ja":"a[0] と a[2] の値を入れ替えるので、{7, 6, 5} になります。","exp_en":"The values of a[0] and a[2] are swapped, giving {7, 6, 5}.","tag":"配列とループ"},{"id":"t4-029","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int[] a = {1, 2, 3};\nint[] b = a;\nb[0] = 9;\nSystem.out.println(a[0]);","choices":["`1`","`9`","`0`","コンパイルエラーになる"],"answer":1,"exp_ja":"b = a で参照がコピーされ、a と b は同じ配列を指します。b[0] の変更は a[0] にも反映されます。","exp_en":"b = a copies the reference, so a and b share one array. A change through b is visible through a.","tag":"配列の参照"},{"id":"t4-030","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int[] a = {1, 2, 3};\nint[] b = new int[3];\nfor (int i = 0; i < a.length; i++) {\n    b[i] = a[i];\n}\nb[0] = 9;\nSystem.out.println(a[0]);","choices":["`1`","`9`","`0`","`3`"],"answer":0,"exp_ja":"要素を1つずつコピーして別の配列 b を作ったので、b を変更しても a は変わりません。","exp_en":"Elements were copied one by one into a separate array b, so changing b does not affect a.","tag":"配列の参照"},{"id":"t4-031","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"public class Main {\n    static void change(int[] x) {\n        x[0] = 100;\n    }\n\n    public static void main(String[] args) {\n        int[] a = {1, 2};\n        change(a);\n        System.out.println(a[0]);\n    }\n}","choices":["`1`","`2`","`100`","コンパイルエラーになる"],"answer":2,"exp_ja":"配列は参照で渡されるため、メソッド内で x[0] を変更すると、呼び出し元の配列 a も変わります。","exp_en":"Arrays are passed by reference, so changing x[0] in the method also changes the caller's array a.","tag":"配列の参照"},{"id":"t4-032","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"public class Main {\n    static int sum(int[] x) {\n        int s = 0;\n        for (int v : x) {\n            s += v;\n        }\n        return s;\n    }\n\n    public static void main(String[] args) {\n        int[] a = {1, 2, 3, 4};\n        System.out.println(sum(a));\n    }\n}","choices":["`4`","`10`","`24`","`1234`"],"answer":1,"exp_ja":"メソッド sum は配列の全要素を加算して返します。1 + 2 + 3 + 4 = 10 です。","exp_en":"The sum method adds all elements and returns the total: 1 + 2 + 3 + 4 = 10.","tag":"配列とループ"},{"id":"t4-033","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int[] a = new int[3];\na[3] = 1;\nSystem.out.println(\"done\");","choices":["`done`","`1`","実行時に ArrayIndexOutOfBoundsException が発生する","コンパイルエラーになる"],"answer":2,"exp_ja":"添字 3 は範囲外です。コンパイルは成功しますが、実行時に例外が発生し、done は表示されません。","exp_en":"Index 3 is out of range. It compiles, but throws an exception at runtime before done is printed.","tag":"添字とlength"},{"id":"t4-034","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int[] a = {1, 2, 3};\nSystem.out.println(a[-1]);","choices":["`3`","`1`","実行時に ArrayIndexOutOfBoundsException が発生する","コンパイルエラーになる"],"answer":2,"exp_ja":"負の添字もコンパイルは通りますが、実行時に ArrayIndexOutOfBoundsException が発生します。","exp_en":"A negative index also compiles, but throws ArrayIndexOutOfBoundsException at runtime.","tag":"添字とlength"},{"id":"t4-035","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int[] a = {1, 2, 3};\nint sum = 0;\nfor (int i = 0; i <= a.length; i++) {\n    sum += a[i];\n}\nSystem.out.println(sum);","choices":["`6`","`0`","実行時に ArrayIndexOutOfBoundsException が発生する","コンパイルエラーになる"],"answer":2,"exp_ja":"i <= a.length のため、最後に i = 3 で a[3] にアクセスし、範囲外で例外が発生します。条件は i < a.length が正しい形です。","exp_en":"Because of i <= a.length, a[3] is accessed at the end and throws an exception. The correct condition is i < a.length.","tag":"配列とループ"},{"id":"t4-036","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"String[] s = new String[2];\nSystem.out.println(s[0].length());","choices":["`0`","`null`","実行時に NullPointerException が発生する","コンパイルエラーになる"],"answer":2,"exp_ja":"s[0] は null なので、null に対して length() を呼び出すと NullPointerException が発生します。","exp_en":"s[0] is null, so calling length() on it throws a NullPointerException.","tag":"オブジェクトの配列"},{"id":"t4-037","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Item {\n    String name;\n\n    Item(String name) {\n        this.name = name;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Item[] items = new Item[2];\n        items[0] = new Item(\"pen\");\n        System.out.println(items[0].name + \" \" + items[1]);\n    }\n}","choices":["`pen null`","`pen 0`","`pen`","実行時に NullPointerException が発生する"],"answer":0,"exp_ja":"items[1] には何も代入していないので null です。文字列連結では null が \"null\" と表示され、例外は発生しません。","exp_en":"items[1] was never assigned, so it is null. In string concatenation null is shown as \"null\" and no exception occurs.","tag":"オブジェクトの配列"},{"id":"t4-038","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Item {\n    int price;\n\n    Item(int price) {\n        this.price = price;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Item[] items = {new Item(100), new Item(250), new Item(50)};\n        int total = 0;\n        for (Item it : items) {\n            total += it.price;\n        }\n        System.out.println(total);\n    }\n}","choices":["`300`","`400`","`350`","`100250`"],"answer":1,"exp_ja":"100 + 250 + 50 = 400 です。拡張for文で、Item の配列の要素を順に取り出しています。","exp_en":"100 + 250 + 50 = 400. The enhanced for statement takes each element of the Item array in turn.","tag":"オブジェクトの配列"},{"id":"t4-039","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Item {\n    int price;\n\n    Item(int price) {\n        this.price = price;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Item[] items = new Item[2];\n        System.out.println(items[0].price);\n    }\n}","choices":["`0`","`null`","実行時に NullPointerException が発生する","コンパイルエラーになる"],"answer":2,"exp_ja":"items[0] は null です。new Item(...) で生成していないため、price にアクセスすると NullPointerException が発生します。","exp_en":"items[0] is null because no Item was created with new, so accessing price throws a NullPointerException.","tag":"オブジェクトの配列"},{"id":"t4-040","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"class Item {\n    int price;\n\n    Item(int price) {\n        this.price = price;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Item a = new Item(10);\n        Item[] items = new Item[2];\n        items[0] = a;\n        items[1] = a;\n        items[0].price = 99;\n        System.out.println(items[1].price);\n    }\n}","choices":["`10`","`99`","`0`","コンパイルエラーになる"],"answer":1,"exp_ja":"items[0] と items[1] は同じオブジェクトを参照しているので、items[0] 経由の変更が items[1] からも見えます。","exp_en":"items[0] and items[1] refer to the same object, so a change through one is visible through the other.","tag":"オブジェクトの配列"},{"id":"t4-041","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int[] a = new int[5];\na[1] = 3;\nSystem.out.println(a.length);","choices":["`1`","`3`","`5`","`4`"],"answer":2,"exp_ja":"length は配列の要素数で、値を代入した個数ではありません。生成時に決めた 5 です。","exp_en":"length is the size of the array, not the number of assigned elements. It is 5, as set at creation.","tag":"添字とlength"},{"id":"t4-042","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"char[] c = {'a', 'b', 'c'};\nSystem.out.println(c.length + \" \" + c[0]);","choices":["`3 a`","`2 a`","`3 97`","`3 0`"],"answer":0,"exp_ja":"char型の配列も要素数は 3 で、c[0] は文字 a です。文字列連結では文字がそのまま表示されます。","exp_en":"The char array also has 3 elements, and c[0] is the character a, shown as is in string concatenation.","tag":"添字とlength"},{"id":"t4-043","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int[] a = {1, 2, 3};\nint x = a;\nSystem.out.println(x);","choices":["`1`","`3`","実行時エラーになる","コンパイルエラーになる"],"answer":3,"exp_ja":"配列(int[])を int型の変数に代入することはできないため、コンパイルエラーになります。","exp_en":"An array (int[]) cannot be assigned to an int variable, so this is a compile error.","tag":"配列の参照"},{"id":"t4-044","theme":4,"type":"output","q":"次のコードを実行したときの結果はどれか。","code":"int[] a = new int[2];\na[0] = \"1\";\nSystem.out.println(a[0]);","choices":["`1`","`0`","実行時エラーになる","コンパイルエラーになる"],"answer":3,"exp_ja":"int型の配列の要素に、String型の値は代入できないので、コンパイルエラーになります。","exp_en":"A String value cannot be assigned to an element of an int array, so this is a compile error.","tag":"配列の宣言・生成"},{"id":"t4-045","theme":4,"type":"fill","q":"要素数が 3 の配列になるように、空欄に入る式を選べ。","code":"int[] a = ____;\nSystem.out.println(a.length);","choices":["`new int(3)`","`new int[3]`","`int[3]`","`new int{3}`"],"answer":1,"exp_ja":"配列は new int[要素数] で生成します。","exp_en":"An array is created with new int[size].","tag":"配列の宣言・生成"},{"id":"t4-046","theme":4,"type":"fill","q":"実行結果が 7 になるように、空欄に入る添字を選べ。","code":"int[] a = {5, 6, 7};\nSystem.out.println(a[____]);","choices":["`1`","`2`","`3`","`a.length`"],"answer":1,"exp_ja":"7 は3番目の要素で、添字は 2 です。添字 3 や a.length は範囲外になります。","exp_en":"7 is the third element, at index 2. Index 3 or a.length is out of range.","tag":"添字とlength"},{"id":"t4-047","theme":4,"type":"fill","q":"実行結果が 7(最後の要素)になるように、空欄に入る演算子を選べ。","code":"int[] a = {5, 6, 7};\nSystem.out.println(a[a.length ____ 1]);","choices":["`+`","`-`","`*`","`/`"],"answer":1,"exp_ja":"a.length は 3 なので、a.length - 1 = 2 で最後の要素を指します。","exp_en":"a.length is 3, so a.length - 1 = 2 points to the last element.","tag":"添字とlength"},{"id":"t4-048","theme":4,"type":"fill","q":"合計が 6 になるように、空欄に入る比較演算子を選べ。","code":"int[] a = {1, 2, 3};\nint sum = 0;\nfor (int i = 0; i ____ a.length; i++) {\n    sum += a[i];\n}\nSystem.out.println(sum);","choices":["`<=`","`<`","`>`","`==`"],"answer":1,"exp_ja":"i が 0 から a.length - 1 の間だけ繰り返すので、i < a.length です。<= だと範囲外になります。","exp_en":"The loop must run for i from 0 to a.length - 1, so i < a.length. <= would go out of range.","tag":"配列とループ"},{"id":"t4-049","theme":4,"type":"fill","q":"実行結果が 6 になるように、空欄に入る式を選べ。","code":"int[] a = new int[3];\nfor (int i = 0; i < a.length; i++) {\n    a[i] = ____;\n}\nSystem.out.println(a[0] + a[1] + a[2]);","choices":["`i`","`1`","`i + 1`","`i * 3`"],"answer":2,"exp_ja":"a[i] に i + 1 を代入すると {1, 2, 3} になり、合計は 6 です。","exp_en":"Assigning i + 1 to a[i] gives {1, 2, 3}, whose sum is 6.","tag":"配列とループ"},{"id":"t4-050","theme":4,"type":"fill","q":"Item型の配列の要素にオブジェクトを格納するための、空欄
